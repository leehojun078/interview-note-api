<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-gray-50 dark:bg-dark-bg text-gray-900 dark:text-dark-text min-h-screen flex flex-col">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: toast}"></div>

<main class="flex-1 py-12 md:py-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="hero-title text-4xl md:text-5xl font-bold text-gray-900 dark:text-dark-text mb-8">📚 면접 질문 목록</h1>

        <!-- 필터 (데스크톱에서만 표시) -->
        <div class="fade-in-section delay-200 hidden md:block sticky top-16 z-40 bg-white dark:bg-dark-card rounded-lg shadow-md p-6 mb-8 dark:border dark:border-dark-lighter">
            <form th:action="@{/questions}" method="get"
                  hx-get="/questions/fragment"
                  hx-target="#question-list-container"
                  hx-indicator="#loading-indicator"
                  hx-trigger="submit, change from:select"
                  class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 items-end">
                <!-- 직무 분야 필터 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-dark-muted mb-2">직무 분야</label>
                    <select name="jobField" id="jobFieldSelect"
                            class="w-full px-4 py-2 border border-gray-300 dark:border-dark-lighter dark:bg-dark-bg dark:text-dark-text rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">전체 (기본값 적용)</option>
                        <option th:each="job : ${jobFields}"
                                th:value="${job.name()}"
                                th:text="${job.displayName}"
                                th:selected="${selectedJobField == job.name()}"></option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-dark-muted mb-2">카테고리</label>
                    <select name="category" id="categorySelect"
                            class="w-full px-4 py-2 border border-gray-300 dark:border-dark-lighter dark:bg-dark-bg dark:text-dark-text rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">전체</option>
                        <!-- JavaScript로 동적 생성 -->
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-dark-muted mb-2">난이도</label>
                    <select name="difficulty"
                            class="w-full px-4 py-2 border border-gray-300 dark:border-dark-lighter dark:bg-dark-bg dark:text-dark-text rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">전체</option>
                        <option value="EASY" th:selected="${selectedDifficulty == 'EASY'}">쉬움</option>
                        <option value="MEDIUM" th:selected="${selectedDifficulty == 'MEDIUM'}">보통</option>
                        <option value="HARD" th:selected="${selectedDifficulty == 'HARD'}">어려움</option>
                    </select>
                </div>
                <button type="submit"
                        class="bg-primary hover:bg-primary-dark text-white font-semibold px-6 py-2 rounded-lg transition shadow-md hover:shadow-lg">
                    필터 적용
                </button>
            </form>
        </div>

        <!-- 모바일 필터 플로팅 버튼 -->
        <button id="mobile-filter-btn"
                class="md:hidden fixed bottom-6 right-6 z-50 bg-primary hover:bg-primary-dark text-white font-semibold px-6 py-3 rounded-full shadow-lg hover:shadow-xl transition-all duration-200 flex items-center gap-2">
            <span>🎯</span>
            <span>필터</span>
        </button>

        <!-- 모바일 Bottom Sheet -->
        <div id="filter-bottom-sheet" class="md:hidden fixed inset-0 z-50 hidden">
            <!-- Backdrop -->
            <div id="filter-backdrop" class="absolute inset-0 bg-black bg-opacity-50 transition-opacity duration-300"></div>

            <!-- Bottom Sheet Content -->
            <div id="filter-sheet-content" class="absolute bottom-0 left-0 right-0 bg-white dark:bg-dark-card rounded-t-3xl shadow-2xl transform transition-transform duration-300 translate-y-full max-h-[85vh] overflow-y-auto">
                <!-- Handle -->
                <div class="sticky top-0 z-10 bg-white dark:bg-dark-card pt-3 pb-2 rounded-t-3xl">
                    <div class="w-12 h-1.5 bg-gray-300 dark:bg-dark-lighter rounded-full mx-auto"></div>
                </div>

                <!-- Filter Form -->
                <div class="p-6">
                    <h2 class="text-2xl font-bold text-gray-900 dark:text-dark-text mb-6">필터 설정</h2>

                    <form id="mobile-filter-form" th:action="@{/questions}" method="get" class="space-y-6">
                        <!-- 직무 분야 필터 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-dark-text mb-2">직무 분야</label>
                            <select name="jobField" id="mobileJobFieldSelect"
                                    class="w-full px-4 py-3 border border-gray-300 dark:border-dark-lighter dark:bg-dark-bg dark:text-dark-text rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                                <option value="">전체 (기본값 적용)</option>
                                <option th:each="job : ${jobFields}"
                                        th:value="${job.name()}"
                                        th:text="${job.displayName}"
                                        th:selected="${selectedJobField == job.name()}"></option>
                            </select>
                        </div>

                        <!-- 카테고리 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-dark-text mb-2">카테고리</label>
                            <select name="category" id="mobileCategorySelect"
                                    class="w-full px-4 py-3 border border-gray-300 dark:border-dark-lighter dark:bg-dark-bg dark:text-dark-text rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                                <option value="">전체</option>
                                <!-- JavaScript로 동적 생성 -->
                            </select>
                        </div>

                        <!-- 난이도 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 dark:text-dark-text mb-2">난이도</label>
                            <select name="difficulty" id="mobileDifficultySelect"
                                    class="w-full px-4 py-3 border border-gray-300 dark:border-dark-lighter dark:bg-dark-bg dark:text-dark-text rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                                <option value="">전체</option>
                                <option value="EASY" th:selected="${selectedDifficulty == 'EASY'}">쉬움</option>
                                <option value="MEDIUM" th:selected="${selectedDifficulty == 'MEDIUM'}">보통</option>
                                <option value="HARD" th:selected="${selectedDifficulty == 'HARD'}">어려움</option>
                            </select>
                        </div>

                        <!-- 버튼 -->
                        <div class="flex gap-3">
                            <button type="button" id="close-filter-btn"
                                    class="flex-1 bg-gray-200 dark:bg-dark-lighter hover:bg-gray-300 dark:hover:bg-gray-700 text-gray-800 dark:text-dark-text font-semibold px-6 py-3 rounded-lg transition">
                                취소
                            </button>
                            <button type="submit"
                                    class="flex-1 bg-primary hover:bg-primary-dark text-white font-semibold px-6 py-3 rounded-lg transition shadow-md hover:shadow-lg">
                                적용
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 로딩 인디케이터 -->
        <div id="loading-indicator" class="htmx-indicator mb-4">
            <div class="flex items-center justify-center gap-3 py-4 bg-blue-50 dark:bg-blue-900 dark:bg-opacity-20 rounded-lg border border-blue-200 dark:border-blue-800">
                <span class="spinner"></span>
                <span class="text-blue-700 dark:text-blue-300 font-medium">질문 목록을 불러오는 중...</span>
            </div>
        </div>

        <!-- 질문 카드 목록 컨테이너 -->
        <div id="question-list-container">
            <div th:replace="~{questions/list-fragment :: question-list-fragment}"></div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: toast-script}"></script>
<script th:replace="~{fragments/layout :: dark-mode-script}"></script>

<!-- Phase 5: 직무별 동적 카테고리 필터링 -->
<script th:inline="javascript">
    /*<![CDATA[*/
    // 서버에서 전달받은 직무별 카테고리 맵
    const categoriesByJobField = /*[[${categoriesByJobField}]]*/ {};
    const selectedJobField = /*[[${selectedJobField}]]*/ '';
    const selectedCategory = /*[[${selectedCategory}]]*/ '';

    // 직무 선택 시 카테고리 업데이트
    document.getElementById('jobFieldSelect').addEventListener('change', function() {
        updateCategories(this.value);
    });

    /**
     * 선택된 직무에 맞는 카테고리만 표시
     * @param jobField 선택된 직무 (예: "IT", "SALES")
     */
    function updateCategories(jobField) {
        const categorySelect = document.getElementById('categorySelect');

        // 직무가 선택되지 않았거나 빈 문자열이면 IT 기본값 사용
        const effectiveJobField = jobField || 'IT';
        const categories = categoriesByJobField[effectiveJobField] || [];

        // 기존 옵션 제거 (전체 옵션 제외)
        categorySelect.innerHTML = '<option value="">전체</option>';

        // 새 카테고리 추가
        categories.forEach(category => {
            const option = document.createElement('option');
            option.value = category;
            option.textContent = category;
            // 이전에 선택되었던 카테고리가 새로운 직무에도 있으면 선택 유지
            if (category === selectedCategory) {
                option.selected = true;
            }
            categorySelect.appendChild(option);
        });
    }

    // 페이지 로드 시 초기화
    window.addEventListener('DOMContentLoaded', () => {
        updateCategories(selectedJobField || 'IT');
    });

    // 모바일 필터 동기화 (모바일 select 변경 시)
    const mobileJobFieldSelect = document.getElementById('mobileJobFieldSelect');
    if (mobileJobFieldSelect) {
        mobileJobFieldSelect.addEventListener('change', function() {
            updateMobileCategories(this.value);
        });
    }

    /**
     * 모바일 필터의 카테고리 업데이트
     */
    function updateMobileCategories(jobField) {
        const categorySelect = document.getElementById('mobileCategorySelect');
        if (!categorySelect) return;

        const effectiveJobField = jobField || 'IT';
        const categories = categoriesByJobField[effectiveJobField] || [];

        categorySelect.innerHTML = '<option value="">전체</option>';

        categories.forEach(category => {
            const option = document.createElement('option');
            option.value = category;
            option.textContent = category;
            if (category === selectedCategory) {
                option.selected = true;
            }
            categorySelect.appendChild(option);
        });
    }

    // 모바일 Bottom Sheet 제어
    const mobileFilterBtn = document.getElementById('mobile-filter-btn');
    const filterBottomSheet = document.getElementById('filter-bottom-sheet');
    const filterBackdrop = document.getElementById('filter-backdrop');
    const filterSheetContent = document.getElementById('filter-sheet-content');
    const closeFilterBtn = document.getElementById('close-filter-btn');

    // Bottom Sheet 열기
    function openBottomSheet() {
        if (!filterBottomSheet) return;

        // 모바일 필터 카테고리 초기화
        updateMobileCategories(selectedJobField || 'IT');

        // Body 스크롤 방지
        document.body.style.overflow = 'hidden';

        // Bottom Sheet 표시
        filterBottomSheet.classList.remove('hidden');

        // 애니메이션을 위한 약간의 지연
        setTimeout(() => {
            filterBackdrop.style.opacity = '1';
            filterSheetContent.classList.remove('translate-y-full');
        }, 10);
    }

    // Bottom Sheet 닫기
    function closeBottomSheet() {
        if (!filterBottomSheet) return;

        // 애니메이션
        filterBackdrop.style.opacity = '0';
        filterSheetContent.classList.add('translate-y-full');

        // 애니메이션 완료 후 숨김
        setTimeout(() => {
            filterBottomSheet.classList.add('hidden');
            document.body.style.overflow = '';
        }, 300);
    }

    // 이벤트 리스너
    if (mobileFilterBtn) {
        mobileFilterBtn.addEventListener('click', openBottomSheet);
    }

    if (closeFilterBtn) {
        closeFilterBtn.addEventListener('click', closeBottomSheet);
    }

    if (filterBackdrop) {
        filterBackdrop.addEventListener('click', closeBottomSheet);
    }

    // 폼 제출 시 Bottom Sheet 닫기
    const mobileFilterForm = document.getElementById('mobile-filter-form');
    if (mobileFilterForm) {
        mobileFilterForm.addEventListener('submit', () => {
            closeBottomSheet();
        });
    }

    // ESC 키로 닫기
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !filterBottomSheet.classList.contains('hidden')) {
            closeBottomSheet();
        }
    });
    /*]]>*/
</script>

<!-- Fade-in Animation Script -->
<script>
    // Intersection Observer로 스크롤 애니메이션 트리거
    const observerOptions = {
        root: null,
        rootMargin: '0px',
        threshold: 0.1
    };

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                observer.unobserve(entry.target);
            }
        });
    }, observerOptions);

    // 페이지 로드 후 애니메이션 적용
    document.addEventListener('DOMContentLoaded', () => {
        // 제목은 즉시 표시
        const heroTitle = document.querySelector('.hero-title');
        if (heroTitle) {
            setTimeout(() => {
                heroTitle.classList.add('is-visible');
            }, 100);
        }

        // 나머지 섹션들은 Intersection Observer로 관찰
        const fadeInElements = document.querySelectorAll('.fade-in-section');
        fadeInElements.forEach(el => {
            observer.observe(el);
        });

        // 카드 stagger 애니메이션
        const cardElements = document.querySelectorAll('.card-stagger');
        cardElements.forEach(el => {
            observer.observe(el);
        });
    });
</script>
</body>
</html>
