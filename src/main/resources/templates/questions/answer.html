<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-gray-50 dark:bg-dark-bg text-gray-900 dark:text-dark-text min-h-screen flex flex-col">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: toast}"></div>

<main class="flex-1 py-12 md:py-16">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="mb-6">
            <a th:href="@{/questions}"
               class="inline-flex items-center text-gray-600 hover:text-gray-900 font-medium transition">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                질문 목록으로
            </a>
        </div>

        <h1 class="text-4xl md:text-5xl font-bold text-gray-900 dark:text-dark-text mb-8">✍️ 답변 작성</h1>

        <!-- 검증 에러 메시지 -->
        <div th:if="${validationError}" class="bg-red-50 dark:bg-red-900 dark:bg-opacity-20 border-l-4 border-red-500 dark:border-red-600 rounded-lg p-4 mb-6">
            <div class="flex items-start">
                <svg class="w-6 h-6 text-red-500 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <div>
                    <h3 class="font-semibold text-red-900 mb-1">답변 품질 검증 실패</h3>
                    <p class="text-red-700" th:text="${validationError}">검증 에러 메시지</p>
                </div>
            </div>
        </div>

        <!-- 질문 표시 -->
        <div class="bg-blue-50 dark:bg-blue-900 dark:bg-opacity-20 border-l-4 border-primary dark:border-primary-light rounded-lg p-6 mb-6">
            <div class="flex flex-wrap gap-2 mb-3">
                <span class="badge badge-blue"
                      th:text="${question.category}">
                    카테고리
                </span>
                <span class="badge"
                      th:classappend="${question.difficulty == 'EASY'} ? 'badge-green' : (${question.difficulty == 'MEDIUM'} ? 'badge-yellow' : 'badge-red')"
                      th:text="${question.difficulty == 'EASY'} ? '쉬움' : (${question.difficulty == 'MEDIUM'} ? '보통' : '어려움')">
                    난이도
                </span>
            </div>
            <h2 class="text-2xl font-semibold text-gray-900 dark:text-dark-text"
                th:text="${question.content}">
                질문 내용
            </h2>
        </div>

        <!-- 답변 작성 폼 -->
        <form th:action="@{/questions/{id}/answer(id=${question.id})}"
              method="post">
            <input type="hidden" name="questionId" th:value="${question.id}" />

            <div class="bg-white dark:bg-dark-card rounded-lg shadow-md p-6 mb-6 dark:border dark:border-dark-lighter">
                <label class="block text-lg font-semibold text-gray-900 dark:text-dark-text mb-2">
                    답변 작성
                </label>
                <p class="text-sm text-gray-600 dark:text-dark-muted mb-4">
                    50자 이상 2000자 이하로 작성해주세요. 구체적인 예시와 경험을 포함하면 더 좋은 평가를 받을 수 있습니다.
                </p>

                <textarea
                        name="answerText"
                        id="answerText"
                        rows="15"
                        class="textarea-field"
                        placeholder="여기에 답변을 작성하세요..."
                        required
                        minlength="50"
                        maxlength="2000"
                        oninput="updateCharCount()"
                        th:attr="hx-post=@{/questions/{id}/draft(id=${question.id})}, hx-trigger='keyup changed delay:2s', hx-include='[name=answerText]', hx-swap='none', data-question-id=${question.id}"
                ></textarea>

                <div class="flex justify-between items-center mt-2">
                    <div class="flex items-center gap-2">
                        <span id="charCount" class="text-sm text-gray-500 dark:text-dark-muted">0 / 2000자</span>
                        <span id="draftStatus" class="text-xs text-gray-400 dark:text-dark-muted hidden">
                            <svg class="w-3 h-3 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                            </svg>
                            임시 저장됨
                        </span>
                    </div>
                    <span id="charWarning" class="text-sm text-red-500 hidden">
                        최소 50자 이상 작성해주세요
                    </span>
                </div>
            </div>

            <!-- 제출 버튼 -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button type="submit"
                        class="btn-primary text-lg disabled:opacity-50 disabled:cursor-not-allowed"
                        id="submitBtn"
                        onclick="showLoading(event)">
                    <span id="submitText">제출하고 평가 받기 →</span>
                    <span id="loadingText" class="hidden flex items-center justify-center gap-2">
                        <span class="spinner spinner-white"></span>
                        AI 평가 중... (5-6초 소요)
                    </span>
                </button>
            </div>

        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: toast-script}"></script>
<script th:replace="~{fragments/layout :: dark-mode-script}"></script>

<script>
    function updateCharCount() {
        const textarea = document.getElementById('answerText');
        const charCount = document.getElementById('charCount');
        const charWarning = document.getElementById('charWarning');
        const submitBtn = document.getElementById('submitBtn');

        const length = textarea.value.length;
        charCount.textContent = length + ' / 2000자';

        if (length < 50) {
            charWarning.classList.remove('hidden');
            submitBtn.disabled = true;
        } else {
            charWarning.classList.add('hidden');
            submitBtn.disabled = false;
        }

        if (length > 1900) {
            charCount.classList.remove('text-gray-500');
            charCount.classList.add('text-red-500');
        } else {
            charCount.classList.remove('text-red-500');
            charCount.classList.add('text-gray-500');
        }
    }

    function showLoading(event) {
        // 폼 검증 통과 시에만 로딩 표시
        const textarea = document.getElementById('answerText');
        if (textarea.value.length < 50) {
            return; // 검증 실패 시 로딩 표시 안 함
        }

        const submitBtn = document.getElementById('submitBtn');
        const submitText = document.getElementById('submitText');
        const loadingText = document.getElementById('loadingText');

        // 텍스트 전환
        submitText.classList.add('hidden');
        loadingText.classList.remove('hidden');

        // 버튼 비활성화
        submitBtn.disabled = true;
    }

    // 초기 상태 설정
    document.addEventListener('DOMContentLoaded', function() {
        const submitBtn = document.getElementById('submitBtn');
        const charWarning = document.getElementById('charWarning');
        submitBtn.disabled = true;
        charWarning.classList.remove('hidden');

        // Phase 3: 페이지 로드 시 저장된 Draft 불러오기
        loadDraft();
    });

    // Phase 3: 저장된 Draft 불러오기
    function loadDraft() {
        const questionId = document.getElementById('answerText').getAttribute('data-question-id');
        const textarea = document.getElementById('answerText');

        fetch(`/questions/${questionId}/draft`)
            .then(response => response.json())
            .then(data => {
                if (data.success && data.draftText) {
                    textarea.value = data.draftText;
                    updateCharCount();

                    // Draft 불러왔음을 알림 (토스트)
                    const draftStatus = document.getElementById('draftStatus');
                    draftStatus.textContent = '저장된 답변을 불러왔습니다';
                    draftStatus.classList.remove('hidden');
                    setTimeout(() => {
                        draftStatus.classList.add('hidden');
                    }, 3000);
                }
            })
            .catch(error => {
                console.error('Draft 불러오기 실패:', error);
            });
    }

    // Phase 3: HTMX 자동 저장 성공 시 상태 표시
    document.body.addEventListener('htmx:afterRequest', function(event) {
        if (event.detail.pathInfo.requestPath.includes('/draft')) {
            const draftStatus = document.getElementById('draftStatus');
            if (event.detail.successful) {
                draftStatus.textContent = '✓ 임시 저장됨';
                draftStatus.classList.remove('hidden');
                setTimeout(() => {
                    draftStatus.classList.add('hidden');
                }, 2000);
            }
        }
    });
</script>
</body>
</html>
