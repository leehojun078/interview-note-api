<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-gray-50 dark:bg-dark-bg text-gray-900 dark:text-dark-text min-h-screen flex flex-col">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: toast}"></div>

<main class="flex-1 py-12 md:py-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="text-4xl md:text-5xl font-bold text-gray-900 dark:text-dark-text mb-8">📚 면접 질문 목록</h1>

        <!-- 필터 -->
        <div class="sticky top-16 z-40 bg-white dark:bg-dark-card rounded-lg shadow-md p-6 mb-8 dark:border dark:border-dark-lighter">
            <form th:action="@{/questions}" method="get"
                  hx-get="/questions/fragment"
                  hx-target="#question-list-container"
                  hx-indicator="#loading-indicator"
                  hx-trigger="submit, change from:select"
                  class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 items-end">
                <!-- 직무 분야 필터 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-dark-muted mb-2">직무 분야</label>
                    <select name="jobField" id="jobFieldSelect"
                            class="w-full px-4 py-2 border border-gray-300 dark:border-dark-lighter dark:bg-dark-bg dark:text-dark-text rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">전체 (기본값 적용)</option>
                        <option th:each="job : ${jobFields}"
                                th:value="${job.name()}"
                                th:text="${job.displayName}"
                                th:selected="${selectedJobField == job.name()}"></option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-dark-muted mb-2">카테고리</label>
                    <select name="category" id="categorySelect"
                            class="w-full px-4 py-2 border border-gray-300 dark:border-dark-lighter dark:bg-dark-bg dark:text-dark-text rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">전체</option>
                        <!-- JavaScript로 동적 생성 -->
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-dark-muted mb-2">난이도</label>
                    <select name="difficulty"
                            class="w-full px-4 py-2 border border-gray-300 dark:border-dark-lighter dark:bg-dark-bg dark:text-dark-text rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">전체</option>
                        <option value="EASY" th:selected="${selectedDifficulty == 'EASY'}">쉬움</option>
                        <option value="MEDIUM" th:selected="${selectedDifficulty == 'MEDIUM'}">보통</option>
                        <option value="HARD" th:selected="${selectedDifficulty == 'HARD'}">어려움</option>
                    </select>
                </div>
                <button type="submit"
                        class="bg-primary hover:bg-primary-dark text-white font-semibold px-6 py-2 rounded-lg transition shadow-md hover:shadow-lg">
                    필터 적용
                </button>
            </form>
        </div>

        <!-- 로딩 인디케이터 -->
        <div id="loading-indicator" class="htmx-indicator mb-4">
            <div class="flex items-center justify-center gap-3 py-4 bg-blue-50 dark:bg-blue-900 dark:bg-opacity-20 rounded-lg border border-blue-200 dark:border-blue-800">
                <span class="spinner"></span>
                <span class="text-blue-700 dark:text-blue-300 font-medium">질문 목록을 불러오는 중...</span>
            </div>
        </div>

        <!-- 질문 카드 목록 컨테이너 -->
        <div id="question-list-container">
            <div th:replace="~{questions/list :: question-list-fragment}"></div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: toast-script}"></script>
<script th:replace="~{fragments/layout :: dark-mode-script}"></script>

<!-- Phase 3: HTMX - 질문 목록 Fragment -->
<div th:fragment="question-list-fragment">
    <!-- 질문 카드 목록 -->
    <div class="space-y-4">
        <div th:each="question : ${questions}"
             class="card card-interactive">
            <div class="flex flex-col md:flex-row md:justify-between md:items-start gap-4 mb-3">
                <h3 class="text-xl font-semibold text-gray-800 dark:text-dark-text flex-1"
                    th:text="${question.content}">
                    질문 내용
                </h3>
                <span class="badge whitespace-nowrap"
                      th:classappend="${question.difficulty == 'EASY'} ? 'badge-green' : (${question.difficulty == 'MEDIUM'} ? 'badge-yellow' : 'badge-red')"
                      th:text="${question.difficulty == 'EASY'} ? '쉬움' : (${question.difficulty == 'MEDIUM'} ? '보통' : '어려움')">
                    난이도
                </span>
            </div>
            <div class="flex flex-wrap gap-2 items-center mb-4">
                <span class="badge badge-purple"
                      th:text="${question.jobField}">
                    직무 분야
                </span>
                <span class="badge badge-blue"
                      th:text="${question.category}">
                    카테고리
                </span>
                <span class="text-sm text-gray-600 dark:text-dark-muted"
                      th:text="${question.targetJob}">
                    직무
                </span>
            </div>

            <!-- 답변하기 버튼 -->
            <div class="mt-4 pt-4 border-t border-gray-200 dark:border-dark-lighter">
                <a th:href="@{/questions/{id}/answer(id=${question.id})}"
                   class="btn-primary w-full text-center inline-block">
                    답변하기 →
                </a>
            </div>
        </div>
    </div>

    <!-- 빈 상태 -->
    <div th:if="${#lists.isEmpty(questions)}" class="text-center py-12">
        <div class="text-gray-400 dark:text-dark-muted mb-6">
            <svg class="mx-auto h-24 w-24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
        </div>
        <p class="text-xl text-gray-600 dark:text-dark-muted">
            조건에 맞는 질문이 없습니다
        </p>
    </div>
</div>

<!-- Phase 5: 직무별 동적 카테고리 필터링 -->
<script th:inline="javascript">
    /*<![CDATA[*/
    // 서버에서 전달받은 직무별 카테고리 맵
    const categoriesByJobField = /*[[${categoriesByJobField}]]*/ {};
    const selectedJobField = /*[[${selectedJobField}]]*/ '';
    const selectedCategory = /*[[${selectedCategory}]]*/ '';

    // 직무 선택 시 카테고리 업데이트
    document.getElementById('jobFieldSelect').addEventListener('change', function() {
        updateCategories(this.value);
    });

    /**
     * 선택된 직무에 맞는 카테고리만 표시
     * @param jobField 선택된 직무 (예: "IT", "SALES")
     */
    function updateCategories(jobField) {
        const categorySelect = document.getElementById('categorySelect');

        // 직무가 선택되지 않았거나 빈 문자열이면 IT 기본값 사용
        const effectiveJobField = jobField || 'IT';
        const categories = categoriesByJobField[effectiveJobField] || [];

        // 기존 옵션 제거 (전체 옵션 제외)
        categorySelect.innerHTML = '<option value="">전체</option>';

        // 새 카테고리 추가
        categories.forEach(category => {
            const option = document.createElement('option');
            option.value = category;
            option.textContent = category;
            // 이전에 선택되었던 카테고리가 새로운 직무에도 있으면 선택 유지
            if (category === selectedCategory) {
                option.selected = true;
            }
            categorySelect.appendChild(option);
        });
    }

    // 페이지 로드 시 초기화
    window.addEventListener('DOMContentLoaded', () => {
        updateCategories(selectedJobField || 'IT');
    });
    /*]]>*/
</script>
</body>
</html>
