<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-gray-50 dark:bg-dark-bg text-gray-900 dark:text-dark-text min-h-screen flex flex-col">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-1 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <!-- 헤더 -->
        <div class="hero-title text-center">
            <h1 class="text-4xl font-bold text-gray-900 dark:text-dark-text">면접 리뷰</h1>
            <h2 class="mt-6 text-3xl font-extrabold text-gray-900 dark:text-dark-text">
                로그인
            </h2>
            <p class="mt-2 text-sm text-gray-600 dark:text-dark-muted">
                또는
                <a th:href="@{/auth/register}" class="font-medium text-primary hover:text-primary-dark">
                    회원가입
                </a>
            </p>
        </div>

        <!-- 에러 메시지 -->
        <div th:if="${error}" class="fade-in-section delay-200 bg-red-50 dark:bg-red-900 dark:bg-opacity-30 border border-red-200 dark:border-red-700 text-red-600 dark:text-red-300 px-4 py-3 rounded-lg" role="alert">
            <span th:text="${error}">에러 메시지</span>
        </div>

        <!-- 로그아웃 메시지 -->
        <div th:if="${message}" class="fade-in-section delay-200 bg-green-50 dark:bg-green-900 dark:bg-opacity-30 border border-green-200 dark:border-green-700 text-green-600 dark:text-green-300 px-4 py-3 rounded-lg" role="alert">
            <span th:text="${message}">성공 메시지</span>
        </div>

        <!-- 로그인 폼 -->
        <form th:action="@{/auth/login-process}" method="post" class="fade-in-section delay-300 mt-8 space-y-6 bg-white dark:bg-dark-card rounded-lg shadow-md p-6 dark:border dark:border-dark-lighter">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="space-y-4">
                <!-- 이메일 -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 dark:text-dark-text mb-1">
                        이메일
                    </label>
                    <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                            class="appearance-none relative block w-full px-3 py-2 border border-gray-300 dark:border-dark-lighter placeholder-gray-500 dark:placeholder-dark-muted text-gray-900 dark:text-dark-text dark:bg-dark-lighter rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm"
                            placeholder="이메일을 입력하세요"
                    />
                </div>

                <!-- 비밀번호 -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 dark:text-dark-text mb-1">
                        비밀번호
                    </label>
                    <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                            class="appearance-none relative block w-full px-3 py-2 border border-gray-300 dark:border-dark-lighter placeholder-gray-500 dark:placeholder-dark-muted text-gray-900 dark:text-dark-text dark:bg-dark-lighter rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm"
                            placeholder="비밀번호를 입력하세요"
                    />
                </div>
            </div>

            <!-- 로그인 버튼 -->
            <div>
                <button
                        type="submit"
                        class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors"
                >
                    로그인
                </button>
            </div>
        </form>

        <!-- 테스트 계정 안내 (개발 환경) -->
        <div class="fade-in-section delay-500 bg-blue-50 dark:bg-blue-900 dark:bg-opacity-30 border border-blue-200 dark:border-blue-700 rounded-lg p-4">
            <h3 class="text-sm font-semibold text-blue-800 dark:text-blue-300 mb-2">테스트 계정</h3>
            <div class="text-xs text-blue-700 dark:text-blue-400 space-y-1">
                <p><strong>일반 사용자:</strong> test@example.com / password123</p>
                <p><strong>관리자:</strong> admin@example.com / admin123</p>
            </div>
        </div>

        <!-- 푸터 -->
        <div class="text-center text-gray-500 dark:text-dark-muted">
            <p class="text-xs">© 2026 면접 리뷰</p>
            <p class="text-sm mt-2 opacity-75">Developed by <span class="font-semibold">hojun</span></p>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout :: dark-mode-script}"></script>

<!-- Fade-in Animation Script -->
<script>
    const observerOptions = {
        root: null,
        rootMargin: '0px',
        threshold: 0.1
    };

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                observer.unobserve(entry.target);
            }
        });
    }, observerOptions);

    document.addEventListener('DOMContentLoaded', () => {
        const heroTitle = document.querySelector('.hero-title');
        if (heroTitle) {
            setTimeout(() => {
                heroTitle.classList.add('is-visible');
            }, 100);
        }

        const fadeInElements = document.querySelectorAll('.fade-in-section');
        fadeInElements.forEach(el => {
            observer.observe(el);
        });
    });
</script>
</body>
</html>
