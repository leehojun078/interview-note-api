<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: toast}"></div>

<main class="flex-1 py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Hero Section -->
        <div class="text-center py-12">
            <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4">
                🎯 AI 기반 면접 리뷰 앱
            </h1>
            <p class="text-xl text-gray-600 mb-8">
                면접 질문에 답변하고 AI 피드백으로 실력을 향상시키세요
            </p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a th:href="@{/questions}"
                   class="inline-block bg-primary hover:bg-primary-dark text-white font-semibold text-lg px-8 py-3 rounded-lg transition shadow-md hover:shadow-lg">
                    질문 연습 시작하기 →
                </a>
                <a th:href="@{/reviews}"
                   class="inline-block bg-white hover:bg-gray-50 text-gray-700 font-semibold text-lg px-8 py-3 rounded-lg border border-gray-300 transition shadow-md hover:shadow-lg">
                    내 리뷰 이력
                </a>
            </div>
        </div>

        <!-- 직무 미설정 배너 (로그인 사용자만, 직무 없을 때) -->
        <div th:if="${isLoggedIn and !hasJobFieldSet}"
             class="bg-yellow-50 border-l-4 border-yellow-400 p-6 mb-8 rounded-r-lg">
            <div class="flex items-start">
                <div class="flex-shrink-0">
                    <svg class="h-6 w-6 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <div class="ml-4">
                    <p class="text-lg font-bold text-yellow-800">직무 설정이 필요합니다</p>
                    <p class="mt-1 text-yellow-700">
                        프로필에서 직무를 설정하면 맞춤형 질문을 추천해드립니다.
                    </p>
                    <a th:href="@{/profile}"
                       class="mt-3 inline-block bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-semibold px-6 py-2 rounded-lg transition">
                        프로필 설정하러 가기 →
                    </a>
                </div>
            </div>
        </div>

        <!-- 추천 질문 섹션 (로그인 사용자만) -->
        <div th:if="${isLoggedIn and not #lists.isEmpty(recommendedQuestions)}" class="mb-12">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">
                <span th:text="${userJobField}"></span> 추천 질문
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div th:each="question : ${recommendedQuestions}"
                     class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition">
                    <!-- 카테고리 배지 -->
                    <div class="flex flex-wrap gap-2 mb-3">
                        <span class="inline-block px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-xs font-medium"
                              th:text="${question.category}">
                        </span>
                        <!-- 난이도 배지 -->
                        <span class="inline-block px-3 py-1 rounded-full text-xs font-medium"
                              th:classappend="${question.difficulty == 'EASY'} ? 'bg-green-100 text-green-800' :
                                             (${question.difficulty == 'MEDIUM'} ? 'bg-yellow-100 text-yellow-800' :
                                             'bg-red-100 text-red-800')"
                              th:text="${question.difficulty == 'EASY'} ? '쉬움' :
                                       (${question.difficulty == 'MEDIUM'} ? '보통' : '어려움')">
                        </span>
                    </div>

                    <!-- 질문 내용 -->
                    <p class="text-gray-800 mb-4 line-clamp-3" th:text="${question.content}">
                        질문 내용
                    </p>

                    <!-- 답변하기 버튼 -->
                    <a th:href="@{/questions/{id}/answer(id=${question.id})}"
                       class="inline-block bg-primary hover:bg-primary-dark text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                        답변하기 →
                    </a>
                </div>
            </div>
        </div>

        <!-- 최근 답변 -->
        <div th:if="${not #lists.isEmpty(recentReviews)}" class="mt-12">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">최근 답변</h2>
            <div class="space-y-4">
                <div th:each="review : ${recentReviews}"
                     class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition">
                    <div class="flex flex-col md:flex-row md:justify-between md:items-start gap-4">
                        <div class="flex-1">
                            <h3 class="text-xl font-semibold text-gray-800 mb-2"
                                th:text="${review.questionContent}">
                                질문 내용
                            </h3>
                            <span class="inline-block px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm font-medium"
                                  th:text="${review.category}">
                                카테고리
                            </span>
                        </div>
                        <div class="text-left md:text-right">
                            <div class="text-3xl font-bold text-primary"
                                 th:text="${#numbers.formatDecimal(review.averageScore, 1, 1)} + '점'">
                                3.5점
                            </div>
                            <div class="text-sm text-gray-500 mt-1"
                                 th:text="${#temporals.format(review.answeredAt, 'yyyy-MM-dd HH:mm')}">
                                2026-04-11 14:30
                            </div>
                        </div>
                    </div>
                    <div class="mt-4">
                        <a th:href="@{/reviews/{id}(id=${review.answerId})}"
                           class="inline-block bg-white hover:bg-gray-50 text-gray-700 font-medium px-6 py-2 rounded-lg border border-gray-300 transition">
                            상세 보기
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 빈 상태 -->
        <div th:if="${#lists.isEmpty(recentReviews)}" class="text-center py-12">
            <div class="text-gray-400 mb-6">
                <svg class="mx-auto h-24 w-24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
            </div>
            <p class="text-xl text-gray-600 mb-6">
                아직 답변한 질문이 없습니다
            </p>
            <a th:href="@{/questions}"
               class="inline-block bg-primary hover:bg-primary-dark text-white font-semibold px-8 py-3 rounded-lg transition shadow-md hover:shadow-lg">
                첫 질문 시작하기
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: toast-script}"></script>
</body>
</html>
