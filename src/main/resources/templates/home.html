<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-gray-50 dark:bg-dark-bg text-gray-900 dark:text-dark-text min-h-screen flex flex-col">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: toast}"></div>

<main class="flex-1 py-12 md:py-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Hero Section -->
        <div class="relative py-24 md:py-32 overflow-hidden">
            <!-- 배경 그라데이션 -->
            <div class="absolute inset-0 bg-gradient-to-br from-primary via-accent-purple to-primary opacity-10"></div>

            <div class="relative max-w-4xl mx-auto text-center px-4">
                <h1 class="text-6xl md:text-7xl xl:text-8xl font-extrabold text-gray-900 dark:text-dark-text mb-8 leading-tight">
                    면접에서 살아남는<br>
                    <span class="text-gradient-primary">
                        답변력을 증명하세요
                    </span>
                </h1>

                <p class="text-xl md:text-2xl text-gray-600 dark:text-dark-muted mb-12 leading-relaxed font-medium">
                    🎯 실전 면접 질문 340개<br>
                    🤖 AI 실시간 평가 & 피드백<br>
                    📈 답변 품질 개선 트래킹
                </p>

                <!-- CTA 버튼 -->
                <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                    <a th:href="@{/questions}" class="btn-neon">
                        무료로 시작하기 →
                    </a>
                    <a th:href="@{/reviews}" class="btn-secondary">
                        내 리뷰 보기
                    </a>
                </div>

                <!-- 소셜 프루프 -->
                <div class="mt-16 flex flex-wrap justify-center gap-12 text-base text-gray-600 dark:text-dark-muted">
                    <div class="flex flex-col items-center gap-1">
                        <span class="text-5xl font-bold text-primary dark:text-primary-light">340+</span>
                        <span class="font-medium">면접 질문</span>
                    </div>
                    <div class="flex flex-col items-center gap-1">
                        <span class="text-5xl font-bold text-accent-neon">17</span>
                        <span class="font-medium">직무 분야</span>
                    </div>
                    <div class="flex flex-col items-center gap-1">
                        <span class="text-5xl font-bold text-accent-purple">AI</span>
                        <span class="font-medium">실시간 평가</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 직무 미설정 배너 (로그인 사용자만, 직무 없을 때) -->
        <div th:if="${isLoggedIn and !hasJobFieldSet}"
             class="bg-yellow-50 dark:bg-yellow-900 dark:bg-opacity-20 border-l-4 border-yellow-400 dark:border-yellow-600 p-6 mb-8 rounded-r-lg">
            <div class="flex items-start">
                <div class="flex-shrink-0">
                    <svg class="h-6 w-6 text-yellow-400 dark:text-yellow-500" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <div class="ml-4">
                    <p class="text-lg font-bold text-yellow-800 dark:text-yellow-300">직무 설정이 필요합니다</p>
                    <p class="mt-1 text-yellow-700 dark:text-yellow-400">
                        프로필에서 직무를 설정하면 맞춤형 질문을 추천해드립니다.
                    </p>
                    <a th:href="@{/profile}"
                       class="mt-3 inline-block bg-yellow-400 hover:bg-yellow-500 dark:bg-yellow-600 dark:hover:bg-yellow-700 text-yellow-900 dark:text-yellow-100 font-semibold px-6 py-2 rounded-lg transition">
                        프로필 설정하러 가기 →
                    </a>
                </div>
            </div>
        </div>

        <!-- 추천 질문 섹션 (로그인 사용자만) -->
        <div th:if="${isLoggedIn and not #lists.isEmpty(recommendedQuestions)}" class="mb-20">
            <h2 class="text-3xl md:text-4xl font-bold text-gray-800 dark:text-dark-text mb-8">
                💼 <span th:text="${userJobField}"></span> 추천 질문
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div th:each="question : ${recommendedQuestions}"
                     class="card card-interactive">
                    <!-- 카테고리 배지 -->
                    <div class="flex flex-wrap gap-2 mb-3">
                        <span class="badge badge-blue"
                              th:text="${question.category}">
                        </span>
                        <!-- 난이도 배지 -->
                        <span class="badge"
                              th:classappend="${question.difficulty == 'EASY'} ? 'badge-green' :
                                             (${question.difficulty == 'MEDIUM'} ? 'badge-yellow' :
                                             'badge-red')"
                              th:text="${question.difficulty == 'EASY'} ? '쉬움' :
                                       (${question.difficulty == 'MEDIUM'} ? '보통' : '어려움')">
                        </span>
                    </div>

                    <!-- 질문 내용 -->
                    <p class="text-gray-800 dark:text-dark-text mb-4 line-clamp-3" th:text="${question.content}">
                        질문 내용
                    </p>

                    <!-- 답변하기 버튼 -->
                    <a th:href="@{/questions/{id}/answer(id=${question.id})}"
                       class="btn-primary inline-block text-center">
                        답변하기 →
                    </a>
                </div>
            </div>
        </div>

        <!-- 최근 답변 -->
        <div th:if="${not #lists.isEmpty(recentReviews)}" class="mt-20">
            <h2 class="text-3xl md:text-4xl font-bold text-gray-800 dark:text-dark-text mb-8">📝 최근 답변</h2>
            <div class="space-y-4">
                <div th:each="review : ${recentReviews}"
                     class="card card-interactive">
                    <div class="flex flex-col md:flex-row md:justify-between md:items-start gap-4">
                        <div class="flex-1">
                            <h3 class="text-xl font-semibold text-gray-800 dark:text-dark-text mb-2"
                                th:text="${review.questionContent}">
                                질문 내용
                            </h3>
                            <span class="badge badge-blue"
                                  th:text="${review.category}">
                                카테고리
                            </span>
                        </div>
                        <div class="text-left md:text-right">
                            <div class="text-3xl font-bold text-primary dark:text-primary-light"
                                 th:text="${#numbers.formatDecimal(review.averageScore, 1, 1)} + '점'">
                                3.5점
                            </div>
                            <div class="text-sm text-gray-500 dark:text-dark-muted mt-1"
                                 th:text="${#temporals.format(review.answeredAt, 'yyyy-MM-dd HH:mm')}">
                                2026-04-11 14:30
                            </div>
                        </div>
                    </div>
                    <div class="mt-4">
                        <a th:href="@{/reviews/{id}(id=${review.answerId})}"
                           class="btn-secondary inline-block">
                            상세 보기
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 빈 상태 -->
        <div th:if="${#lists.isEmpty(recentReviews)}" class="text-center py-20">
            <div class="text-gray-400 dark:text-dark-muted mb-6">
                <svg class="mx-auto h-24 w-24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
            </div>
            <p class="text-xl text-gray-600 dark:text-dark-muted mb-6">
                아직 답변한 질문이 없습니다
            </p>
            <a th:href="@{/questions}"
               class="inline-block bg-primary hover:bg-primary-dark text-white font-semibold px-8 py-3 rounded-lg transition shadow-md hover:shadow-lg">
                첫 질문 시작하기
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: toast-script}"></script>
<script th:replace="~{fragments/layout :: dark-mode-script}"></script>
</body>
</html>
