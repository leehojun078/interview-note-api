<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-gray-50 dark:bg-dark-bg text-gray-900 dark:text-dark-text min-h-screen flex flex-col">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: toast}"></div>

<main class="flex-1 py-12 md:py-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-6">
            <h1 class="hero-title text-4xl md:text-5xl font-bold text-gray-900 dark:text-dark-text">📊 리뷰 이력</h1>
            <a th:href="@{/questions}"
               class="fade-in-section delay-200 inline-block bg-primary hover:bg-primary-dark text-white font-semibold px-6 py-3 rounded-lg transition shadow-md hover:shadow-lg text-center">
                새 질문 연습하기 →
            </a>
        </div>

        <!-- Phase 8C: 탭 네비게이션 추가 -->
        <div class="flex border-b border-gray-200 dark:border-dark-border mb-6">
            <button onclick="switchTab('question')"
                    id="questionTab"
                    class="px-6 py-3 font-semibold text-primary border-b-2 border-primary transition-colors">
                📝 질문 연습 (<span th:text="${#lists.size(reviews)}">0</span>)
            </button>
            <button onclick="switchTab('mock')"
                    id="mockTab"
                    class="px-6 py-3 font-semibold text-gray-500 hover:text-gray-700 dark:text-dark-muted dark:hover:text-dark-text transition-colors">
                💬 AI 면접 (<span th:text="${#lists.size(mockInterviewReviews)}">0</span>)
            </button>
        </div>

        <!-- 질문 연습 탭 내용 -->
        <div id="questionTabContent">
            <!-- 이력 카드 목록 -->
            <div class="space-y-4" th:if="${not #lists.isEmpty(reviews)}">
                <div th:each="review : ${reviews}"
                     class="card card-interactive card-stagger"
                     th:onclick="|location.href='@{/reviews/{id}(id=${review.answerId})}'|">
                    <div class="flex flex-col md:flex-row md:justify-between md:items-start gap-4">
                        <div class="flex-1">
                            <h3 class="text-xl font-semibold text-gray-800 dark:text-dark-text mb-3"
                                th:text="${review.questionContent}">
                                질문 내용
                            </h3>
                            <div class="flex flex-wrap gap-2 items-center">
                                <span class="badge badge-blue"
                                      th:text="${review.category}">
                                    카테고리
                                </span>
                                <span class="text-sm text-gray-500 dark:text-dark-muted"
                                      th:text="${#temporals.format(review.answeredAt, 'yyyy-MM-dd HH:mm')}">
                                    작성일
                                </span>
                            </div>
                        </div>
                        <div class="text-center md:text-right min-w-[100px]">
                            <div class="text-4xl font-bold mb-1"
                                 th:classappend="${review.averageScore >= 4.0} ? 'text-green-500' : (${review.averageScore >= 3.0} ? 'text-primary' : 'text-yellow-500')"
                                 th:text="${#numbers.formatDecimal(review.averageScore, 1, 1)}">
                                3.5
                            </div>
                            <div class="text-sm text-gray-500 dark:text-dark-muted">/ 5.0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 페이지네이션 -->
            <div th:if="${not #lists.isEmpty(reviews) and page.totalPages > 1}" class="flex justify-center mt-8">
                <nav class="flex items-center gap-2">
                    <!-- 이전 버튼 -->
                    <a th:if="${page.number > 0}"
                       th:href="@{/reviews(page=${page.number - 1}, size=${page.size})}"
                       class="px-4 py-2 bg-white dark:bg-dark-card border border-gray-300 dark:border-dark-lighter rounded-lg hover:bg-gray-50 dark:hover:bg-dark-lighter transition font-medium text-gray-700 dark:text-dark-text">
                        이전
                    </a>
                    <span th:if="${page.number == 0}"
                          class="px-4 py-2 bg-gray-100 dark:bg-dark-lighter border border-gray-300 dark:border-dark-lighter rounded-lg text-gray-400 dark:text-dark-muted font-medium cursor-not-allowed">
                        이전
                    </span>

                    <!-- 페이지 번호 -->
                    <span th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                          th:if="${i >= page.number - 2 and i <= page.number + 2}">
                        <a th:if="${i != page.number}"
                           th:href="@{/reviews(page=${i}, size=${page.size})}"
                           th:text="${i + 1}"
                           class="px-4 py-2 bg-white dark:bg-dark-card border border-gray-300 dark:border-dark-lighter rounded-lg hover:bg-gray-50 dark:hover:bg-dark-lighter transition font-medium text-gray-700 dark:text-dark-text">
                            1
                        </a>
                        <span th:if="${i == page.number}"
                              th:text="${i + 1}"
                              class="px-4 py-2 bg-primary dark:bg-primary-light text-white rounded-lg font-bold">
                            1
                        </span>
                    </span>

                    <!-- 다음 버튼 -->
                    <a th:if="${page.number < page.totalPages - 1}"
                       th:href="@{/reviews(page=${page.number + 1}, size=${page.size})}"
                       class="px-4 py-2 bg-white dark:bg-dark-card border border-gray-300 dark:border-dark-lighter rounded-lg hover:bg-gray-50 dark:hover:bg-dark-lighter transition font-medium text-gray-700 dark:text-dark-text">
                        다음
                    </a>
                    <span th:if="${page.number == page.totalPages - 1}"
                          class="px-4 py-2 bg-gray-100 dark:bg-dark-lighter border border-gray-300 dark:border-dark-lighter rounded-lg text-gray-400 dark:text-dark-muted font-medium cursor-not-allowed">
                        다음
                    </span>
                </nav>
            </div>

            <!-- 빈 상태 -->
            <div th:if="${#lists.isEmpty(reviews)}" class="fade-in-section delay-300 text-center py-16">
                <div class="text-gray-300 dark:text-dark-muted mb-6">
                    <svg class="mx-auto h-32 w-32" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                </div>
                <h2 class="text-2xl font-semibold text-gray-600 dark:text-dark-muted mb-3">아직 답변한 질문이 없습니다</h2>
                <p class="text-gray-500 dark:text-dark-muted mb-8">
                    첫 번째 질문에 답변하고 AI 피드백을 받아보세요!
                </p>
                <a th:href="@{/questions}"
                   class="inline-block bg-primary hover:bg-primary-dark text-white font-semibold px-8 py-3 rounded-lg transition shadow-md hover:shadow-lg">
                    질문 연습 시작하기
                </a>
            </div>
        </div>

        <!-- Phase 8C: AI 면접 탭 내용 (신규) -->
        <div id="mockTabContent" class="hidden">
            <div class="space-y-4" th:if="${not #lists.isEmpty(mockInterviewReviews)}">
                <div th:each="interview : ${mockInterviewReviews}"
                     class="card card-interactive card-stagger"
                     th:onclick="|location.href='@{/mock-interviews/{id}/result(id=${interview.interviewId})}'|">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h3 class="text-xl font-semibold mb-2 text-gray-800 dark:text-dark-text">
                                <span th:text="${interview.jobField}">IT개발</span> 면접
                                <span th:if="${interview.careerLevel != null}"
                                      class="text-sm text-gray-500 dark:text-dark-muted ml-2"
                                      th:text="'(' + ${interview.careerLevel} + ')'">
                                    (신입)
                                </span>
                            </h3>

                            <!-- 채용 공고 정보 (있는 경우) -->
                            <div th:if="${interview.jobPostingInfo != null}"
                                 class="text-sm text-gray-600 dark:text-dark-muted mb-2">
                                <span th:text="${interview.jobPostingInfo.companyName}">회사명</span> ·
                                <span th:text="${interview.jobPostingInfo.jobTitle}">포지션</span>
                            </div>

                            <div class="flex gap-2 items-center">
                                <span class="badge badge-purple"
                                      th:text="${interview.messageCount} + '개 질문'">
                                    5개 질문
                                </span>
                                <span class="text-sm text-gray-500 dark:text-dark-muted"
                                      th:text="${#temporals.format(interview.startedAt, 'yyyy-MM-dd HH:mm')}">
                                    2026-05-03 14:30
                                </span>
                            </div>
                        </div>

                        <!-- 점수 표시 -->
                        <div class="text-center min-w-[100px]">
                            <div class="text-4xl font-bold mb-1"
                                 th:if="${interview.averageScore != null}"
                                 th:classappend="${interview.averageScore >= 4.0} ? 'text-green-500' :
                                                (${interview.averageScore >= 3.0} ? 'text-primary' : 'text-yellow-500')"
                                 th:text="${#numbers.formatDecimal(interview.averageScore, 1, 1)}">
                                3.8
                            </div>
                            <div class="text-sm text-gray-500 dark:text-dark-muted" th:if="${interview.averageScore != null}">/ 5.0</div>
                            <div class="text-sm text-gray-500 dark:text-dark-muted italic" th:if="${interview.averageScore == null}">평가 없음</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 빈 상태 -->
            <div th:if="${#lists.isEmpty(mockInterviewReviews)}" class="text-center py-16">
                <svg class="w-20 h-20 mx-auto mb-4 text-gray-300 dark:text-dark-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                </svg>
                <p class="text-gray-500 dark:text-dark-muted mb-4">아직 완료된 AI 면접이 없습니다.</p>
                <button onclick="openJobFieldModal()" class="btn-neon">
                    첫 AI 면접 시작하기
                </button>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: toast-script}"></script>
<script th:replace="~{fragments/layout :: dark-mode-script}"></script>

<!-- Phase 8C: 탭 전환 JavaScript -->
<script>
function switchTab(tabName) {
    // Show/hide content
    const questionContent = document.getElementById('questionTabContent');
    const mockContent = document.getElementById('mockTabContent');
    const questionTab = document.getElementById('questionTab');
    const mockTab = document.getElementById('mockTab');

    if (tabName === 'question') {
        questionContent.classList.remove('hidden');
        mockContent.classList.add('hidden');

        questionTab.classList.add('text-primary', 'border-b-2', 'border-primary');
        questionTab.classList.remove('text-gray-500', 'dark:text-dark-muted');

        mockTab.classList.remove('text-primary', 'border-b-2', 'border-primary');
        mockTab.classList.add('text-gray-500', 'dark:text-dark-muted');
    } else {
        questionContent.classList.add('hidden');
        mockContent.classList.remove('hidden');

        mockTab.classList.add('text-primary', 'border-b-2', 'border-primary');
        mockTab.classList.remove('text-gray-500', 'dark:text-dark-muted');

        questionTab.classList.remove('text-primary', 'border-b-2', 'border-primary');
        questionTab.classList.add('text-gray-500', 'dark:text-dark-muted');
    }
}
</script>

<!-- Fade-in Animation Script -->
<script>
    const observerOptions = {
        root: null,
        rootMargin: '0px',
        threshold: 0.1
    };

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                observer.unobserve(entry.target);
            }
        });
    }, observerOptions);

    document.addEventListener('DOMContentLoaded', () => {
        const heroTitle = document.querySelector('.hero-title');
        if (heroTitle) {
            setTimeout(() => {
                heroTitle.classList.add('is-visible');
            }, 100);
        }

        const fadeInElements = document.querySelectorAll('.fade-in-section');
        fadeInElements.forEach(el => {
            observer.observe(el);
        });

        const cardElements = document.querySelectorAll('.card-stagger');
        cardElements.forEach(el => {
            observer.observe(el);
        });
    });
</script>

<!-- Global Modals (AI 면접 연습 모달 포함) -->
<div th:replace="~{fragments/layout :: global-modals}"></div>

</body>
</html>
