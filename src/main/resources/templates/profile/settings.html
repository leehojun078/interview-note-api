<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-gray-50 dark:bg-dark-bg text-gray-900 dark:text-dark-text min-h-screen flex flex-col">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: toast}"></div>

<main class="flex-1 py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-dark-text mb-6">프로필 설정</h1>

        <!-- Success/Error Messages -->
        <div th:if="${success}" class="bg-green-100 dark:bg-green-900 dark:bg-opacity-30 border border-green-400 dark:border-green-700 text-green-700 dark:text-green-300 px-4 py-3 rounded-lg mb-4">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="bg-red-100 dark:bg-red-900 dark:bg-opacity-30 border border-red-400 dark:border-red-700 text-red-700 dark:text-red-300 px-4 py-3 rounded-lg mb-4">
            <span th:text="${error}"></span>
        </div>

        <!-- Profile Form -->
        <form method="post" th:action="@{/profile/update}" class="bg-white dark:bg-dark-card shadow-md rounded-lg px-8 pt-6 pb-8 mb-6 dark:border dark:border-dark-lighter">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- Name -->
            <div class="mb-6">
                <label class="block text-gray-700 dark:text-dark-text font-bold mb-2">이름 <span class="text-red-500">*</span></label>
                <input type="text" name="name" th:value="${profile.name}"
                       class="shadow appearance-none border dark:border-dark-lighter rounded-lg w-full py-3 px-4 text-gray-700 dark:text-dark-text dark:bg-dark-lighter leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-primary focus:border-transparent"
                       required minlength="2" maxlength="50"
                       placeholder="이름을 입력하세요"/>
                <p class="text-gray-600 dark:text-dark-muted text-xs mt-2">2-50자 이내로 입력해주세요</p>
            </div>

            <!-- Job Field -->
            <div class="mb-6">
                <label class="block text-gray-700 dark:text-dark-text font-bold mb-2">직무 분야 <span class="text-red-500">*</span></label>
                <select name="jobField" required class="shadow border dark:border-dark-lighter rounded-lg w-full py-3 px-4 text-gray-700 dark:text-dark-text dark:bg-dark-lighter leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-primary focus:border-transparent">
                    <option value="">직무를 선택해주세요</option>
                    <option th:each="job : ${jobFields}"
                            th:value="${job.name()}"
                            th:text="${job.displayName}"
                            th:selected="${profile.jobField == job}"></option>
                </select>
                <p class="text-gray-600 dark:text-dark-muted text-xs mt-2">직무를 설정하면 맞춤형 질문을 추천해드립니다</p>
            </div>

            <!-- Career Level -->
            <div class="mb-6">
                <label class="block text-gray-700 dark:text-dark-text font-bold mb-2">경력 수준 <span class="text-red-500">*</span></label>
                <select name="careerLevel" required class="shadow border dark:border-dark-lighter rounded-lg w-full py-3 px-4 text-gray-700 dark:text-dark-text dark:bg-dark-lighter leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-primary focus:border-transparent">
                    <option value="">경력을 선택해주세요</option>
                    <option th:each="level : ${careerLevels}"
                            th:value="${level.name()}"
                            th:text="${level.displayName}"
                            th:selected="${profile.careerLevel == level}"></option>
                </select>
                <p class="text-gray-600 dark:text-dark-muted text-xs mt-2">경력 수준을 선택해주세요</p>
            </div>

            <!-- Buttons -->
            <div class="flex items-center justify-between pt-4 border-t border-gray-200 dark:border-dark-lighter">
                <button type="submit" class="bg-primary hover:bg-primary-dark text-white font-bold py-3 px-6 rounded-lg focus:outline-none focus:shadow-outline transition duration-200 shadow-md hover:shadow-lg">
                    저장
                </button>
                <a th:href="@{/home}" class="text-primary hover:text-primary-dark font-semibold transition">취소</a>
            </div>
        </form>

        <!-- Account Info -->
        <div class="bg-white dark:bg-dark-card rounded-lg shadow-md p-6 dark:border dark:border-dark-lighter">
            <h2 class="text-xl font-bold text-gray-900 dark:text-dark-text mb-4">계정 정보</h2>
            <div class="space-y-3">
                <div class="flex border-b border-gray-200 dark:border-dark-lighter pb-3">
                    <span class="font-semibold text-gray-700 dark:text-dark-text w-24">이메일:</span>
                    <span class="text-gray-600 dark:text-dark-muted" th:text="${profile.email}"></span>
                </div>
                <div class="flex">
                    <span class="font-semibold text-gray-700 dark:text-dark-text w-24">가입일:</span>
                    <span class="text-gray-600 dark:text-dark-muted" th:text="${#temporals.format(profile.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<!-- Global Modals (AI 면접 연습 모달 포함) -->
<div th:replace="~{fragments/layout :: global-modals}"></div>

<script th:replace="~{fragments/layout :: toast-script}"></script>
<script th:replace="~{fragments/layout :: dark-mode-script}"></script>
</body>
</html>
