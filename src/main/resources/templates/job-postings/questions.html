<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-gray-50 dark:bg-dark-bg text-gray-900 dark:text-dark-text min-h-screen flex flex-col">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: toast}"></div>

<main class="flex-1 py-12 md:py-16">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- 공고 정보 카드 -->
        <div class="bg-white dark:bg-dark-card rounded-lg shadow-md p-6 mb-8 dark:border dark:border-dark-lighter">
            <h1 class="text-3xl font-bold text-gray-900 dark:text-dark-text mb-4">
                <span th:text="${jobPosting.companyName}">회사명</span> -
                <span th:text="${jobPosting.jobTitle}">포지션명</span>
            </h1>
            <div class="flex items-center gap-4 text-sm text-gray-600 dark:text-dark-muted">
                <span class="inline-flex items-center px-3 py-1 rounded-full bg-primary/10 text-primary font-medium"
                      th:text="${jobPosting.effectiveJobField?.displayName}">직무</span>
                <a th:href="${jobPosting.originalUrl}" target="_blank"
                   class="text-primary hover:underline">
                    원본 공고 보기 →
                </a>
            </div>
        </div>

        <!-- Phase 8B: 액션 버튼 영역 (10개 질문 + AI 면접) -->
        <div class="flex flex-col sm:flex-row gap-4 mb-8">
            <!-- 기존: 10개 질문으로 연습 -->
            <a th:href="@{/generated-questions/{id}/answer(id=${jobPosting.questions[0].id})}"
               class="flex-1 btn-neon text-center py-4 text-lg">
                📝 10개 질문으로 연습
            </a>

            <!-- Phase 8B: 채용 공고 기반 AI 면접 추가 -->
            <form th:action="@{/mock-interviews/start}" method="post" class="flex-1">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="jobPostingId" th:value="${jobPosting.id}" />
                <input type="hidden" name="selectedJobField" th:value="${jobPosting.effectiveJobField.name}" />

                <button type="submit"
                        class="w-full btn-neon py-4 text-lg flex items-center justify-center gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                    이 공고로 AI 면접 연습
                </button>
            </form>
        </div>

        <!-- 안내 메시지 -->
        <div class="bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded-lg p-4 mb-6">
            <p class="text-sm text-blue-800 dark:text-blue-300">
                💡 <strong>AI 면접 연습</strong>: 이 채용 공고를 바탕으로 실전 같은 모의 면접을 진행합니다 (2-5개 질문, 실시간 평가).
                경력 수준은 프로필 설정을 따릅니다 (기본값: 신입).
            </p>
        </div>

        <h2 class="text-2xl font-bold text-gray-900 dark:text-dark-text mb-6">
            📋 생성된 질문 (<span th:text="${jobPosting.questions.size()}">10</span>개)
        </h2>

        <!-- 질문 카드 목록 -->
        <div class="space-y-6">
            <div th:each="question, iterStat : ${jobPosting.questions}"
                 class="bg-white dark:bg-dark-card rounded-lg shadow-md p-6 dark:border dark:border-dark-lighter">
                <!-- 질문 헤더 -->
                <div class="flex items-start justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <span class="text-2xl font-bold text-gray-400 dark:text-dark-muted"
                              th:text="'#' + ${question.orderIndex}">1</span>
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 dark:bg-dark-lighter text-gray-700 dark:text-dark-muted"
                              th:text="${question.category}">카테고리</span>
                    </div>
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                          th:classappend="${question.difficulty == 'EASY'} ? 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-300' :
                                        (${question.difficulty == 'MEDIUM'} ? 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-300' :
                                        'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-300')"
                          th:text="${question.difficulty == 'EASY'} ? '쉬움' : (${question.difficulty == 'MEDIUM'} ? '보통' : '어려움')">난이도</span>
                </div>

                <!-- 질문 내용 -->
                <p class="text-lg font-medium text-gray-900 dark:text-dark-text mb-4"
                   th:text="${question.content}">질문 내용</p>

                <!-- AI 생성 근거 (접기 가능) -->
                <details class="mb-4">
                    <summary class="cursor-pointer text-sm text-gray-600 dark:text-dark-muted hover:text-gray-900 dark:hover:text-dark-text">
                        AI 생성 근거 보기
                    </summary>
                    <p class="mt-2 text-sm text-gray-600 dark:text-dark-muted pl-4 border-l-2 border-gray-300 dark:border-dark-lighter"
                       th:text="${question.aiReasoning}">생성 근거</p>
                </details>

                <!-- 답변하기 버튼 -->
                <a th:href="@{/generated-questions/{id}/answer(id=${question.id})}"
                   class="inline-block bg-primary hover:bg-primary-hover text-white font-medium py-2 px-6 rounded-lg transition duration-200">
                    답변하기
                </a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<!-- Global Modals (AI 면접 연습 모달 포함) -->
<div th:replace="~{fragments/layout :: global-modals}"></div>

<script th:replace="~{fragments/layout :: toast-script}"></script>
<script th:replace="~{fragments/layout :: dark-mode-script}"></script>
</body>
</html>
