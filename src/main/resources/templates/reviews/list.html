<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1 style="margin: 0;">복기 이력</h1>
            <a th:href="@{/questions}" class="btn btn-primary">
                새 질문 연습하기 →
            </a>
        </div>

        <!-- 이력 카드 목록 -->
        <div th:each="review : ${reviews}" class="card" style="cursor: pointer;"
             th:onclick="|location.href='@{/reviews/{id}(id=${review.answerId})}'|">
            <div style="display: flex; justify-content: space-between; align-items: start; gap: 2rem;">
                <div style="flex: 1;">
                    <h3 th:text="${review.questionContent}" style="margin-bottom: 0.75rem;">질문 내용</h3>
                    <div style="display: flex; gap: 0.5rem;">
                        <span class="badge badge-category" th:text="${review.category}">카테고리</span>
                        <span style="font-size: 0.875rem; color: #6B7280;"
                              th:text="${#temporals.format(review.answeredAt, 'yyyy-MM-dd HH:mm')}">
                            작성일
                        </span>
                    </div>
                </div>
                <div style="text-align: right; min-width: 100px;">
                    <div style="font-size: 2rem; font-weight: bold; margin-bottom: 0.25rem;"
                         th:style="'color: ' + (${review.averageScore >= 4.0} ? '#10B981' : (${review.averageScore >= 3.0} ? '#2563EB' : '#F59E0B'))"
                         th:text="${#numbers.formatDecimal(review.averageScore, 1, 1)}">
                        3.5
                    </div>
                    <div style="font-size: 0.875rem; color: #6B7280;">/ 5.0</div>
                </div>
            </div>
        </div>

        <!-- 빈 상태 -->
        <div th:if="${#lists.isEmpty(reviews)}" style="text-align: center; padding: 4rem 0;">
            <div style="font-size: 4rem; margin-bottom: 1rem;">📝</div>
            <h2 style="color: #6B7280; margin-bottom: 1rem;">아직 답변한 질문이 없습니다</h2>
            <p style="color: #9CA3AF; margin-bottom: 2rem;">
                첫 번째 질문에 답변하고 AI 피드백을 받아보세요!
            </p>
            <a th:href="@{/questions}" class="btn btn-primary">
                질문 연습 시작하기
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
