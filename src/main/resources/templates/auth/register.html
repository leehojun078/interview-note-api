<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-gray-50 dark:bg-dark-bg text-gray-900 dark:text-dark-text min-h-screen flex flex-col">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-1 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <!-- 헤더 -->
        <div class="hero-title text-center">
            <h1 class="text-4xl font-bold text-gray-900 dark:text-dark-text">면접 리뷰</h1>
            <h2 class="mt-6 text-3xl font-extrabold text-gray-900 dark:text-dark-text">
                회원가입
            </h2>
            <p class="mt-2 text-sm text-gray-600 dark:text-dark-muted">
                이미 계정이 있으신가요?
                <a th:href="@{/auth/login}" class="font-medium text-primary hover:text-primary-dark">
                    로그인
                </a>
            </p>
        </div>

        <!-- 전체 에러 메시지 -->
        <div th:if="${error}" class="fade-in-section delay-200 bg-red-50 dark:bg-red-900 dark:bg-opacity-30 border border-red-200 dark:border-red-700 text-red-600 dark:text-red-300 px-4 py-3 rounded-lg" role="alert">
            <span th:text="${error}">에러 메시지</span>
        </div>

        <!-- 회원가입 폼 -->
        <form th:action="@{/auth/register-process}" th:object="${registerForm}" method="post" class="fade-in-section delay-300 mt-8 space-y-6 bg-white dark:bg-dark-card rounded-lg shadow-md p-6 dark:border dark:border-dark-lighter">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="space-y-4">
                <!-- 이메일 -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 dark:text-dark-text mb-1">
                        이메일 <span class="text-red-500">*</span>
                    </label>
                    <input
                            id="email"
                            th:field="*{email}"
                            type="email"
                            autocomplete="email"
                            required
                            class="appearance-none relative block w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm dark:bg-dark-lighter dark:text-dark-text dark:placeholder-dark-muted"
                            th:classappend="${#fields.hasErrors('email')} ? 'border-red-300 dark:border-red-700' : 'border-gray-300 dark:border-dark-lighter'"
                            placeholder="example@email.com"
                    />
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 text-xs text-red-600 dark:text-red-400"></p>
                </div>

                <!-- 이름 -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 dark:text-dark-text mb-1">
                        이름 <span class="text-red-500">*</span>
                    </label>
                    <input
                            id="name"
                            th:field="*{name}"
                            type="text"
                            autocomplete="name"
                            required
                            class="appearance-none relative block w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm dark:bg-dark-lighter dark:text-dark-text dark:placeholder-dark-muted"
                            th:classappend="${#fields.hasErrors('name')} ? 'border-red-300 dark:border-red-700' : 'border-gray-300 dark:border-dark-lighter'"
                            placeholder="홍길동"
                    />
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-xs text-red-600 dark:text-red-400"></p>
                </div>

                <!-- 비밀번호 -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 dark:text-dark-text mb-1">
                        비밀번호 <span class="text-red-500">*</span>
                    </label>
                    <input
                            id="password"
                            th:field="*{password}"
                            type="password"
                            autocomplete="new-password"
                            required
                            class="appearance-none relative block w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm dark:bg-dark-lighter dark:text-dark-text dark:placeholder-dark-muted"
                            th:classappend="${#fields.hasErrors('password')} ? 'border-red-300 dark:border-red-700' : 'border-gray-300 dark:border-dark-lighter'"
                            placeholder="8자 이상, 영문/숫자/특수문자 중 2가지 이상"
                    />
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1 text-xs text-red-600 dark:text-red-400"></p>
                    <p class="mt-1 text-xs text-gray-500 dark:text-dark-muted">영문, 숫자, 특수문자 중 2가지 이상 포함 (8-100자)</p>
                </div>

                <!-- 비밀번호 확인 -->
                <div>
                    <label for="passwordConfirm" class="block text-sm font-medium text-gray-700 dark:text-dark-text mb-1">
                        비밀번호 확인 <span class="text-red-500">*</span>
                    </label>
                    <input
                            id="passwordConfirm"
                            th:field="*{passwordConfirm}"
                            type="password"
                            autocomplete="new-password"
                            required
                            class="appearance-none relative block w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm dark:bg-dark-lighter dark:text-dark-text dark:placeholder-dark-muted"
                            th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'border-red-300 dark:border-red-700' : 'border-gray-300 dark:border-dark-lighter'"
                            placeholder="비밀번호를 다시 입력하세요"
                    />
                    <p th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}" class="mt-1 text-xs text-red-600 dark:text-red-400"></p>
                </div>
            </div>

            <!-- 회원가입 버튼 -->
            <div>
                <button
                        type="submit"
                        class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors"
                >
                    회원가입
                </button>
            </div>
        </form>

        <!-- 안내 사항 -->
        <div class="fade-in-section delay-500 bg-gray-100 dark:bg-dark-card border border-gray-200 dark:border-dark-lighter rounded-lg p-4">
            <h3 class="text-sm font-semibold text-gray-800 dark:text-dark-text mb-2">회원가입 안내</h3>
            <ul class="text-xs text-gray-600 dark:text-dark-muted space-y-1 list-disc list-inside">
                <li>면접 질문에 답변하고 AI 평가를 받을 수 있습니다</li>
                <li>답변 이력을 저장하고 나중에 다시 확인할 수 있습니다</li>
                <li>개인정보는 안전하게 암호화되어 저장됩니다</li>
            </ul>
        </div>

        <!-- 푸터 -->
        <div class="text-center text-sm text-gray-500 dark:text-dark-muted">
            <p>© 2026 면접 리뷰. Phase 4A.</p>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout :: dark-mode-script}"></script>

<!-- Fade-in Animation Script -->
<script>
    const observerOptions = {
        root: null,
        rootMargin: '0px',
        threshold: 0.1
    };

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                observer.unobserve(entry.target);
            }
        });
    }, observerOptions);

    document.addEventListener('DOMContentLoaded', () => {
        const heroTitle = document.querySelector('.hero-title');
        if (heroTitle) {
            setTimeout(() => {
                heroTitle.classList.add('is-visible');
            }, 100);
        }

        const fadeInElements = document.querySelectorAll('.fade-in-section');
        fadeInElements.forEach(el => {
            observer.observe(el);
        });
    });
</script>
</body>
</html>
