<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-1 flex items-center justify-center py-12">
    <div class="max-w-md mx-auto px-4 text-center">
        <!-- 404 Icon -->
        <div class="mb-8">
            <svg class="mx-auto h-48 w-48 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                      d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M12 12h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>

        <!-- 404 Text -->
        <h1 class="text-9xl font-bold text-gray-200 mb-4">404</h1>
        <h2 class="text-3xl font-semibold text-gray-800 mb-4">
            페이지를 찾을 수 없습니다
        </h2>
        <p class="text-gray-600 mb-8">
            요청하신 페이지가 존재하지 않거나 이동되었습니다.<br>
            URL을 확인해주세요.
        </p>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="/"
               class="inline-block bg-primary hover:bg-primary-dark text-white font-semibold px-8 py-3 rounded-lg transition shadow-md hover:shadow-lg">
                홈으로 돌아가기
            </a>
            <a href="/questions"
               class="inline-block bg-white hover:bg-gray-50 text-gray-700 font-semibold px-8 py-3 rounded-lg border border-gray-300 transition shadow-md hover:shadow-lg">
                질문 목록 보기
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
