<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-1 flex items-center justify-center py-12">
    <div class="max-w-md mx-auto px-4 text-center">
        <!-- 500 Icon -->
        <div class="mb-8">
            <svg class="mx-auto h-48 w-48 text-red-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                      d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>

        <!-- 500 Text -->
        <h1 class="text-9xl font-bold text-red-200 mb-4">500</h1>
        <h2 class="text-3xl font-semibold text-gray-800 mb-4">
            서버 오류가 발생했습니다
        </h2>
        <p class="text-gray-600 mb-4">
            일시적인 오류가 발생했습니다.<br>
            잠시 후 다시 시도해주세요.
        </p>

        <!-- Error ID (for debugging) -->
        <div th:if="${errorId}" class="bg-gray-100 rounded-lg p-4 mb-8">
            <p class="text-sm text-gray-600">
                에러 ID: <span class="font-mono font-semibold" th:text="${errorId}">error-id</span>
            </p>
            <p class="text-xs text-gray-500 mt-1">
                문제가 지속되면 위 ID를 함께 문의해주세요.
            </p>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="/"
               class="inline-block bg-primary hover:bg-primary-dark text-white font-semibold px-8 py-3 rounded-lg transition shadow-md hover:shadow-lg">
                홈으로 돌아가기
            </a>
            <a href="javascript:history.back()"
               class="inline-block bg-white hover:bg-gray-50 text-gray-700 font-semibold px-8 py-3 rounded-lg border border-gray-300 transition shadow-md hover:shadow-lg">
                이전 페이지로
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
