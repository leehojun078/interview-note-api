# ==============================================
# 공통 설정 (모든 환경)
# ==============================================
spring.application.name=interview-note-api

# OpenAI Configuration
openai.api-key=${OPENAI_API_KEY}
openai.model=gpt-4o-mini
openai.prompt-version=v1.0
openai.max-tokens=3000
openai.temperature=0.7
openai.timeout=30000

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${SPRING_PROFILES_ACTIVE:dev}

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA
spring.jpa.hibernate.ddl-auto=validate

# ==============================================
# Rate Limit Configuration
# ==============================================
rate-limit.max-requests-per-hour=${RATE_LIMIT_MAX_REQUESTS:33}
rate-limit.window-duration-minutes=${RATE_LIMIT_WINDOW:60}
rate-limit.max-question-generations-per-day=${RATE_LIMIT_QUESTIONS:10}
rate-limit.question-generation-window-hours=24
rate-limit.max-mock-interviews-per-day=${RATE_LIMIT_INTERVIEWS:5}
rate-limit.mock-interview-window-hours=24

# ==============================================
# Cache Configuration
# ==============================================
cache.duplicate-request-hours=${CACHE_DUPLICATE_HOURS:24}
cache.question-days=${CACHE_QUESTION_DAYS:7}
cache.job-posting-days=${CACHE_JOB_POSTING_DAYS:7}

# ==============================================
# Async Thread Pool Configuration
# ==============================================
async.core-pool-size=${ASYNC_CORE_POOL:10}
async.max-pool-size=${ASYNC_MAX_POOL:50}
async.queue-capacity=${ASYNC_QUEUE_CAPACITY:100}
async.await-termination-seconds=${ASYNC_AWAIT_TERMINATION:30}
