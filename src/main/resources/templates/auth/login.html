<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 면접 리뷰</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
<div class="max-w-md w-full space-y-8">
    <!-- 헤더 -->
    <div class="text-center">
        <h1 class="text-4xl font-bold text-gray-900">면접 리뷰</h1>
        <h2 class="mt-6 text-3xl font-extrabold text-gray-900">
            로그인
        </h2>
        <p class="mt-2 text-sm text-gray-600">
            또는
            <a th:href="@{/auth/register}" class="font-medium text-blue-600 hover:text-blue-500">
                회원가입
            </a>
        </p>
    </div>

    <!-- 에러 메시지 -->
    <div th:if="${error}" class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg" role="alert">
        <span th:text="${error}">에러 메시지</span>
    </div>

    <!-- 로그아웃 메시지 -->
    <div th:if="${message}" class="bg-green-50 border border-green-200 text-green-600 px-4 py-3 rounded-lg" role="alert">
        <span th:text="${message}">성공 메시지</span>
    </div>

    <!-- 로그인 폼 -->
    <form th:action="@{/auth/login-process}" method="post" class="mt-8 space-y-6">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="rounded-md shadow-sm space-y-4">
            <!-- 이메일 -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                    이메일
                </label>
                <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                        class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                        placeholder="이메일을 입력하세요"
                />
            </div>

            <!-- 비밀번호 -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                    비밀번호
                </label>
                <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                        class="appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                        placeholder="비밀번호를 입력하세요"
                />
            </div>
        </div>

        <!-- 로그인 버튼 -->
        <div>
            <button
                    type="submit"
                    class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors"
            >
                로그인
            </button>
        </div>
    </form>

    <!-- 테스트 계정 안내 (개발 환경) -->
    <div class="mt-6 bg-blue-50 border border-blue-200 rounded-lg p-4">
        <h3 class="text-sm font-semibold text-blue-800 mb-2">테스트 계정</h3>
        <div class="text-xs text-blue-700 space-y-1">
            <p><strong>일반 사용자:</strong> test@example.com / password123</p>
            <p><strong>관리자:</strong> admin@example.com / admin123</p>
        </div>
    </div>

    <!-- 푸터 -->
    <div class="text-center text-sm text-gray-500">
        <p>© 2026 면접 리뷰. Phase 4A.</p>
    </div>
</div>
</body>
</html>
