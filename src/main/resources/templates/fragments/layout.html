<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: '면접 리뷰 앱'">면접 리뷰 앱</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class', // Phase 3: 다크모드 지원
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#2563EB',
                            dark: '#1D4ED8',
                            light: '#3B82F6'
                        },
                        accent: {
                            neon: '#00E5A0',  // LimitZero 스타일
                            purple: '#4F6EF7'
                        },
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444',
                        // Phase 3: 다크모드 색상
                        dark: {
                            bg: '#0a0b0f',      // LimitZero 스타일 거의 검정
                            card: '#1a1b1f',    // 카드 배경
                            lighter: '#2a2b2f', // 더 밝은 배경
                            text: '#e5e7eb',    // 텍스트
                            muted: '#9ca3af'    // 보조 텍스트
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans KR', 'system-ui', 'sans-serif']
                    },
                    boxShadow: {
                        'glow-sm': '0 0 10px rgba(0, 229, 160, 0.3)',
                        'glow-md': '0 0 20px rgba(0, 229, 160, 0.4)',
                        'glow-lg': '0 0 30px rgba(0, 229, 160, 0.5)'
                    }
                }
            }
        }
    </script>

    <!-- Custom Components CSS -->
    <link rel="stylesheet" th:href="@{/css/components.css}">

    <!-- Phase 3: HTMX Helpers & Scroll Animations -->
    <script defer th:src="@{/js/htmx-helpers.js}"></script>

</head>

<body class="bg-gray-50 dark:bg-dark-bg text-gray-900 dark:text-dark-text min-h-screen flex flex-col">

<!-- Navigation Bar -->
<nav th:fragment="navbar" class="sticky top-0 z-50 bg-primary dark:bg-dark-bg text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
            <div class="flex items-center">
                <a th:href="@{/}" class="text-2xl font-bold hover:opacity-80 transition">
                    📝 면접 리뷰
                </a>
            </div>

            <!-- Mobile menu button -->
            <button id="mobile-menu-btn" class="md:hidden text-white focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>

            <!-- Desktop menu -->
            <ul class="hidden md:flex items-center space-x-6">
                <li>
                    <a th:href="@{/}"
                       class="hover:opacity-80 transition font-medium">
                        홈
                    </a>
                </li>

                <!-- 로그인 상태에서만 보이는 메뉴 -->
                <li sec:authorize="isAuthenticated()">
                    <a th:href="@{/questions}"
                       class="hover:opacity-80 transition font-medium">
                        질문 연습
                    </a>
                </li>
                <li sec:authorize="isAuthenticated()">
                    <a th:href="@{/job-postings}"
                       class="hover:opacity-80 transition font-medium">
                        내 채용 공고
                    </a>
                </li>
                <li sec:authorize="isAuthenticated()">
                    <a th:href="@{/reviews}"
                       class="hover:opacity-80 transition font-medium">
                        리뷰 이력
                    </a>
                </li>
                <li sec:authorize="isAuthenticated()">
                    <a th:href="@{/profile}"
                       class="hover:opacity-80 transition font-medium">
                        프로필 설정
                    </a>
                </li>

                <!-- Phase 3: 다크모드 토글 버튼 -->
                <li class="flex items-center">
                    <button id="dark-mode-toggle" class="p-2 rounded-lg hover:bg-white hover:bg-opacity-10 transition" title="다크모드 전환">
                        <!-- Sun icon (light mode) -->
                        <svg id="sun-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/>
                        </svg>
                        <!-- Moon icon (dark mode) -->
                        <svg id="moon-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
                        </svg>
                    </button>
                </li>

                <!-- 로그인 상태 표시 -->
                <li sec:authorize="isAuthenticated()" class="flex items-center space-x-4 ml-4 pl-4 border-l border-white border-opacity-30">
                    <span class="flex items-center gap-2 text-sm opacity-90">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
                        </svg>
                        <span th:if="${#authentication.principal.class.simpleName == 'CustomUserDetails'}"
                              th:text="${#authentication.principal.name}">사용자</span>
                        <span th:unless="${#authentication.principal.class.simpleName == 'CustomUserDetails'}"
                              sec:authentication="name">user@example.com</span>님
                    </span>
                    <form th:action="@{/auth/logout}" method="post" class="inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit"
                                class="bg-white bg-opacity-20 hover:bg-opacity-30 px-4 py-1.5 rounded-lg transition text-sm font-medium">
                            로그아웃
                        </button>
                    </form>
                </li>

                <!-- 비로그인 상태에서만 보이는 메뉴 -->
                <li sec:authorize="!isAuthenticated()" class="flex items-center space-x-3 ml-4 pl-4 border-l border-white border-opacity-30">
                    <a th:href="@{/auth/login}"
                       class="hover:opacity-80 transition font-medium">
                        로그인
                    </a>
                    <a th:href="@{/auth/register}"
                       class="bg-white bg-opacity-20 hover:bg-opacity-30 px-4 py-1.5 rounded-lg transition font-medium">
                        회원가입
                    </a>
                </li>
            </ul>
        </div>

        <!-- Mobile menu (hidden by default) -->
        <div id="mobile-menu" class="hidden md:hidden border-t border-white border-opacity-20">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a th:href="@{/}" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-primary-dark transition">
                    홈
                </a>

                <!-- 로그인 상태에서만 보이는 메뉴 -->
                <div sec:authorize="isAuthenticated()">
                    <a th:href="@{/questions}" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-primary-dark transition">
                        질문 연습
                    </a>
                    <a th:href="@{/job-postings}" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-primary-dark transition">
                        내 채용 공고
                    </a>
                    <a th:href="@{/reviews}" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-primary-dark transition">
                        리뷰 이력
                    </a>
                    <a th:href="@{/profile}" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-primary-dark transition">
                        프로필 설정
                    </a>
                    <div class="px-3 py-2 border-t border-white border-opacity-20 mt-2">
                        <div class="flex items-center gap-2 mb-2">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
                            </svg>
                            <span class="text-sm">
                                <span th:if="${#authentication.principal.class.simpleName == 'CustomUserDetails'}"
                                      th:text="${#authentication.principal.name}">사용자</span>
                                <span th:unless="${#authentication.principal.class.simpleName == 'CustomUserDetails'}"
                                      sec:authentication="name">user@example.com</span>님
                            </span>
                        </div>
                        <form th:action="@{/auth/logout}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="w-full bg-white bg-opacity-20 hover:bg-opacity-30 px-4 py-2 rounded-lg transition text-sm font-medium text-left">
                                로그아웃
                            </button>
                        </form>
                    </div>
                </div>

                <!-- 비로그인 상태에서만 보이는 메뉴 -->
                <div sec:authorize="!isAuthenticated()">
                    <a th:href="@{/auth/login}" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-primary-dark transition">
                        로그인
                    </a>
                    <a th:href="@{/auth/register}" class="block px-3 py-2 bg-white bg-opacity-20 hover:bg-opacity-30 rounded-md text-base font-medium transition">
                        회원가입
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile menu toggle script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const mobileMenuBtn = document.getElementById('mobile-menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');

            if (mobileMenuBtn && mobileMenu) {
                mobileMenuBtn.addEventListener('click', function() {
                    mobileMenu.classList.toggle('hidden');
                });
            }
        });
    </script>
</nav>

<!-- Toast Notification (hidden by default) -->
<div th:fragment="toast" id="toast" class="hidden fixed top-4 right-4 z-50">
    <div class="bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg flex items-center space-x-2">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
        </svg>
        <span id="toast-message">성공!</span>
    </div>
</div>

<!-- Footer -->
<footer th:fragment="footer" class="bg-gray-100 dark:bg-dark-card mt-auto border-t dark:border-dark-lighter">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="text-center text-gray-600 dark:text-dark-muted">
            <p>&copy; 2026 면접 리뷰 앱 | Spring Boot + Kotlin + AI</p>
            <p class="text-sm mt-2">OpenAI GPT-4o-mini 기반 AI 피드백 시스템 | Phase 5</p>
            <p class="text-xs mt-3 opacity-75">Developed by <span class="font-semibold">hojun</span></p>
        </div>
    </div>
</footer>

<!-- Toast Script -->
<script th:fragment="toast-script">
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');
        const toastDiv = toast.querySelector('div');

        toastMessage.textContent = message;

        // Change color based on type
        if (type === 'success') {
            toastDiv.className = 'bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg flex items-center space-x-2';
        } else if (type === 'error') {
            toastDiv.className = 'bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg flex items-center space-x-2';
        } else if (type === 'info') {
            toastDiv.className = 'bg-blue-500 text-white px-6 py-3 rounded-lg shadow-lg flex items-center space-x-2';
        }

        toast.classList.remove('hidden');

        setTimeout(() => {
            toast.classList.add('hidden');
        }, 3000);
    }

    // Show toast from URL parameters
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('success')) {
            showToast(urlParams.get('success'), 'success');
        }
        if (urlParams.get('error')) {
            const errorType = urlParams.get('error');
            if (errorType === 'ratelimit') {
                showToast('요청 한도를 초과했습니다. 잠시 후 다시 시도해주세요.', 'error');
            } else if (errorType === 'validation') {
                showToast('입력값을 확인해주세요.', 'error');
            } else {
                showToast('오류가 발생했습니다.', 'error');
            }
        }
    });
</script>

<!-- Phase 3: 다크모드 토글 스크립트 -->
<script th:fragment="dark-mode-script">
    // 다크모드 초기화 (localStorage에서 불러오기, 기본값: 다크모드)
    (function initDarkMode() {
        const darkMode = localStorage.getItem('darkMode');
        const htmlElement = document.documentElement;

        if (darkMode === 'false') {
            // 명시적으로 라이트모드로 설정된 경우만 라이트모드
            htmlElement.classList.remove('dark');
            updateDarkModeIcons(false);
        } else {
            // 기본값(null) 또는 'true'인 경우 다크모드
            htmlElement.classList.add('dark');
            updateDarkModeIcons(true);
        }
    })();

    // 다크모드 토글 버튼 이벤트 리스너
    document.addEventListener('DOMContentLoaded', function() {
        const toggleButton = document.getElementById('dark-mode-toggle');
        if (toggleButton) {
            toggleButton.addEventListener('click', toggleDarkMode);
        }
    });

    // 다크모드 토글 함수
    function toggleDarkMode() {
        const htmlElement = document.documentElement;
        const isDark = htmlElement.classList.toggle('dark');

        // localStorage에 저장
        localStorage.setItem('darkMode', isDark);

        // 아이콘 업데이트
        updateDarkModeIcons(isDark);
    }

    // 다크모드 아이콘 업데이트
    function updateDarkModeIcons(isDark) {
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');

        if (sunIcon && moonIcon) {
            if (isDark) {
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            } else {
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            }
        }
    }
</script>

</body>
</html>
