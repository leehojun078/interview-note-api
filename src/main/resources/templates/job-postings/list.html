<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-gray-50 dark:bg-dark-bg text-gray-900 dark:text-dark-text min-h-screen flex flex-col">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: toast}"></div>

<main class="flex-1 py-12 md:py-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="hero-title text-4xl md:text-5xl font-bold text-gray-900 dark:text-dark-text">
                📂 내 채용 공고
            </h1>
            <a th:href="@{/job-postings/create}"
               class="bg-primary hover:bg-primary-hover text-white font-medium py-2 px-6 rounded-lg transition duration-200">
                + 새 공고 등록
            </a>
        </div>

        <!-- 공고 목록 -->
        <div th:if="${jobPostings.isEmpty()}" class="text-center py-12">
            <p class="text-gray-600 dark:text-dark-muted mb-4">등록된 공고가 없습니다</p>
            <a th:href="@{/job-postings/create}"
               class="inline-block bg-primary hover:bg-primary-hover text-white font-medium py-2 px-6 rounded-lg transition duration-200">
                공고 등록하기
            </a>
        </div>

        <div th:unless="${jobPostings.isEmpty()}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div th:each="posting : ${jobPostings}"
                 class="bg-white dark:bg-dark-card rounded-lg shadow-md p-6 hover:shadow-lg transition-shadow dark:border dark:border-dark-lighter">
                <h3 class="text-xl font-bold text-gray-900 dark:text-dark-text mb-2"
                    th:text="${posting.companyName}">회사명</h3>
                <p class="text-gray-600 dark:text-dark-muted mb-4"
                   th:text="${posting.jobTitle}">포지션명</p>

                <div class="flex items-center gap-2 mb-4">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-primary/10 text-primary"
                          th:text="${posting.effectiveJobField?.displayName}">직무</span>
                    <span class="text-sm text-gray-500 dark:text-dark-muted"
                          th:text="${posting.questionCount} + '개 질문'">10개 질문</span>
                </div>

                <a th:href="@{/job-postings/{id}/questions(id=${posting.id})}"
                   class="inline-block bg-primary hover:bg-primary-hover text-white font-medium py-2 px-4 rounded-lg transition duration-200">
                    질문 보기
                </a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: toast-script}"></script>
<script th:replace="~{fragments/layout :: dark-mode-script}"></script>
</body>
</html>
