<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 면접 리뷰</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
<div class="max-w-md w-full space-y-8">
    <!-- 헤더 -->
    <div class="text-center">
        <h1 class="text-4xl font-bold text-gray-900">면접 리뷰</h1>
        <h2 class="mt-6 text-3xl font-extrabold text-gray-900">
            회원가입
        </h2>
        <p class="mt-2 text-sm text-gray-600">
            이미 계정이 있으신가요?
            <a th:href="@{/auth/login}" class="font-medium text-blue-600 hover:text-blue-500">
                로그인
            </a>
        </p>
    </div>

    <!-- 전체 에러 메시지 -->
    <div th:if="${error}" class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg" role="alert">
        <span th:text="${error}">에러 메시지</span>
    </div>

    <!-- 회원가입 폼 -->
    <form th:action="@{/auth/register-process}" th:object="${registerForm}" method="post" class="mt-8 space-y-6">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="rounded-md shadow-sm space-y-4">
            <!-- 이메일 -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                    이메일 <span class="text-red-500">*</span>
                </label>
                <input
                        id="email"
                        th:field="*{email}"
                        type="email"
                        autocomplete="email"
                        required
                        class="appearance-none relative block w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        th:classappend="${#fields.hasErrors('email')} ? 'border-red-300' : 'border-gray-300'"
                        placeholder="example@email.com"
                />
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 text-xs text-red-600"></p>
            </div>

            <!-- 이름 -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
                    이름 <span class="text-red-500">*</span>
                </label>
                <input
                        id="name"
                        th:field="*{name}"
                        type="text"
                        autocomplete="name"
                        required
                        class="appearance-none relative block w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        th:classappend="${#fields.hasErrors('name')} ? 'border-red-300' : 'border-gray-300'"
                        placeholder="홍길동"
                />
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-xs text-red-600"></p>
            </div>

            <!-- 비밀번호 -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                    비밀번호 <span class="text-red-500">*</span>
                </label>
                <input
                        id="password"
                        th:field="*{password}"
                        type="password"
                        autocomplete="new-password"
                        required
                        class="appearance-none relative block w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        th:classappend="${#fields.hasErrors('password')} ? 'border-red-300' : 'border-gray-300'"
                        placeholder="8자 이상, 영문/숫자/특수문자 중 2가지 이상"
                />
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1 text-xs text-red-600"></p>
                <p class="mt-1 text-xs text-gray-500">영문, 숫자, 특수문자 중 2가지 이상 포함 (8-100자)</p>
            </div>

            <!-- 비밀번호 확인 -->
            <div>
                <label for="passwordConfirm" class="block text-sm font-medium text-gray-700 mb-1">
                    비밀번호 확인 <span class="text-red-500">*</span>
                </label>
                <input
                        id="passwordConfirm"
                        th:field="*{passwordConfirm}"
                        type="password"
                        autocomplete="new-password"
                        required
                        class="appearance-none relative block w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'border-red-300' : 'border-gray-300'"
                        placeholder="비밀번호를 다시 입력하세요"
                />
                <p th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}" class="mt-1 text-xs text-red-600"></p>
            </div>
        </div>

        <!-- 회원가입 버튼 -->
        <div>
            <button
                    type="submit"
                    class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors"
            >
                회원가입
            </button>
        </div>
    </form>

    <!-- 안내 사항 -->
    <div class="mt-6 bg-gray-100 border border-gray-200 rounded-lg p-4">
        <h3 class="text-sm font-semibold text-gray-800 mb-2">회원가입 안내</h3>
        <ul class="text-xs text-gray-600 space-y-1 list-disc list-inside">
            <li>면접 질문에 답변하고 AI 평가를 받을 수 있습니다</li>
            <li>답변 이력을 저장하고 나중에 다시 확인할 수 있습니다</li>
            <li>개인정보는 안전하게 암호화되어 저장됩니다</li>
        </ul>
    </div>

    <!-- 푸터 -->
    <div class="text-center text-sm text-gray-500">
        <p>© 2026 면접 리뷰. Phase 4A.</p>
    </div>
</div>
</body>
</html>
