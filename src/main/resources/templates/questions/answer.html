<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: toast}"></div>

<main class="flex-1 py-8">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="mb-6">
            <a th:href="@{/questions}"
               class="inline-flex items-center text-gray-600 hover:text-gray-900 font-medium transition">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                질문 목록으로
            </a>
        </div>

        <h1 class="text-3xl font-bold text-gray-900 mb-6">답변 작성</h1>

        <!-- 검증 에러 메시지 -->
        <div th:if="${validationError}" class="bg-red-50 border-l-4 border-red-500 rounded-lg p-4 mb-6">
            <div class="flex items-start">
                <svg class="w-6 h-6 text-red-500 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <div>
                    <h3 class="font-semibold text-red-900 mb-1">답변 품질 검증 실패</h3>
                    <p class="text-red-700" th:text="${validationError}">검증 에러 메시지</p>
                </div>
            </div>
        </div>

        <!-- 질문 표시 -->
        <div class="bg-blue-50 border-l-4 border-primary rounded-lg p-6 mb-6">
            <div class="flex flex-wrap gap-2 mb-3">
                <span class="inline-block px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm font-medium"
                      th:text="${question.category}">
                    카테고리
                </span>
                <span class="inline-block px-3 py-1 rounded-full text-sm font-medium"
                      th:classappend="${question.difficulty == 'EASY'} ? 'bg-green-100 text-green-800' : (${question.difficulty == 'MEDIUM'} ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800')"
                      th:text="${question.difficulty == 'EASY'} ? '쉬움' : (${question.difficulty == 'MEDIUM'} ? '보통' : '어려움')">
                    난이도
                </span>
            </div>
            <h2 class="text-2xl font-semibold text-gray-900"
                th:text="${question.content}">
                질문 내용
            </h2>
        </div>

        <!-- 답변 작성 폼 -->
        <form th:action="@{/questions/{id}/answer(id=${question.id})}"
              method="post">
            <input type="hidden" name="questionId" th:value="${question.id}" />

            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <label class="block text-lg font-semibold text-gray-900 mb-2">
                    답변 작성
                </label>
                <p class="text-sm text-gray-600 mb-4">
                    50자 이상 2000자 이하로 작성해주세요. 구체적인 예시와 경험을 포함하면 더 좋은 평가를 받을 수 있습니다.
                </p>

                <textarea
                        name="answerText"
                        id="answerText"
                        rows="15"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent resize-y"
                        placeholder="여기에 답변을 작성하세요..."
                        required
                        minlength="50"
                        maxlength="2000"
                        oninput="updateCharCount()"
                ></textarea>

                <div class="flex justify-between items-center mt-2">
                    <span id="charCount" class="text-sm text-gray-500">0 / 2000자</span>
                    <span id="charWarning" class="text-sm text-red-500 hidden">
                        최소 50자 이상 작성해주세요
                    </span>
                </div>
            </div>

            <!-- 제출 버튼 -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button type="submit"
                        class="bg-primary hover:bg-primary-dark text-white font-semibold text-lg px-8 py-3 rounded-lg transition shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
                        id="submitBtn">
                    제출하고 평가 받기 →
                </button>
            </div>

        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: toast-script}"></script>

<script>
    function updateCharCount() {
        const textarea = document.getElementById('answerText');
        const charCount = document.getElementById('charCount');
        const charWarning = document.getElementById('charWarning');
        const submitBtn = document.getElementById('submitBtn');

        const length = textarea.value.length;
        charCount.textContent = length + ' / 2000자';

        if (length < 50) {
            charWarning.classList.remove('hidden');
            submitBtn.disabled = true;
        } else {
            charWarning.classList.add('hidden');
            submitBtn.disabled = false;
        }

        if (length > 1900) {
            charCount.classList.remove('text-gray-500');
            charCount.classList.add('text-red-500');
        } else {
            charCount.classList.remove('text-red-500');
            charCount.classList.add('text-gray-500');
        }
    }

    // 초기 상태 설정
    document.addEventListener('DOMContentLoaded', function() {
        const submitBtn = document.getElementById('submitBtn');
        const charWarning = document.getElementById('charWarning');
        submitBtn.disabled = true;
        charWarning.classList.remove('hidden');
    });
</script>
</body>
</html>
