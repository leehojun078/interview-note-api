# Nginx SSE 설정 파일 (Amazon Linux 2023)
# EC2 서버의 /etc/nginx/conf.d/interview-note-api.conf 파일로 저장

server {
    listen 80;
    server_name your-domain.com;  # 실제 도메인으로 변경

    # 일반 요청
    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE 전용 설정 (중요!)
    location /mock-interviews {
        proxy_pass http://localhost:8080;

        # ========== SSE를 위한 필수 설정 ==========

        # 1. 버퍼링 완전 비활성화 (가장 중요!)
        proxy_buffering off;
        proxy_cache off;

        # 2. HTTP/1.1 사용 (SSE 필수)
        proxy_http_version 1.1;

        # 3. Keep-Alive 연결 유지
        proxy_set_header Connection '';

        # 4. Chunked 전송 비활성화
        chunked_transfer_encoding off;

        # 5. 타임아웃 설정 (SSE는 장시간 연결)
        proxy_read_timeout 3600s;      # 1시간 (면접 시간 고려)
        proxy_send_timeout 3600s;      # 1시간
        proxy_connect_timeout 60s;     # 연결 타임아웃

        # 6. 헤더 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 7. 추가 SSE 최적화
        proxy_set_header X-Accel-Buffering no;  # Nginx 버퍼링 명시적 비활성화
    }

    # HTTPS 리디렉션 (선택 사항)
    # listen 443 ssl;
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;
}
