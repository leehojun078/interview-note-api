<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>AI 면접 채팅</title>
</head>
<body class="bg-gray-50 dark:bg-dark-bg text-gray-900 dark:text-dark-text min-h-screen flex flex-col">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: toast}"></div>

<main class="flex-1 py-8">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- 에러 메시지 표시 영역 -->
        <div id="errorAlert" class="hidden mb-6 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
            <div class="flex items-start">
                <div class="flex-1">
                    <strong class="font-bold" id="errorTitle">오류 발생</strong>
                    <p class="text-sm mt-1" id="errorMessage"></p>
                    <p class="text-xs mt-1 text-red-600" id="errorDetail"></p>
                </div>
                <button onclick="closeErrorAlert()" class="ml-4">
                    <svg class="fill-current h-6 w-6 text-red-500" role="button" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                        <title>닫기</title>
                        <path d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1 0 1.698z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 헤더 -->
        <div class="card mb-6">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900 dark:text-dark-text mb-2">
                        <span th:if="${interview.jobPostingId != null}">
                            <!-- 공고 기반 면접 (향후 구현) -->
                            <span th:text="${interview.selectedJobField.displayName}">IT개발</span> 면접
                        </span>
                        <span th:unless="${interview.jobPostingId != null}">
                            <!-- 직무 기반 일반 면접 -->
                            <span th:text="${interview.selectedJobField.displayName}">IT개발</span> 면접
                        </span>
                    </h1>
                    <p class="text-sm text-gray-600 dark:text-dark-muted">
                        시작: <span th:text="${#temporals.format(interview.startedAt, 'yyyy-MM-dd HH:mm')}">2026-05-01 10:25</span>
                    </p>
                </div>
                <form id="endInterviewForm" th:action="@{/mock-interviews/{id}/end(id=${interview.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="button" id="endBtn"
                            class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg transition-colors shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                        <span id="endText">면접 종료</span>
                        <span id="endLoadingText" class="hidden flex items-center justify-center gap-2">
                            <span class="spinner spinner-white spinner-sm"></span>
                            종합 평가 생성 중... (8-10초 소요)
                        </span>
                    </button>
                </form>
            </div>
        </div>

        <!-- 메시지 영역 -->
        <div class="card mb-6">
            <div id="messagesContainer"
                 class="space-y-4 overflow-y-auto"
                 style="height: 400px; scroll-behavior: smooth;">

                <!-- 기존 메시지 렌더링 (Thymeleaf) -->
                <div th:each="message : ${messages}">
                    <!-- AI 메시지 (왼쪽, 파란색) -->
                    <div th:if="${message.sender.name() == 'AI'}" class="flex justify-start">
                        <div class="max-w-xl">
                            <div class="flex items-center gap-2 mb-1">
                                <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold text-sm">
                                    AI
                                </div>
                                <span class="text-xs text-gray-500 dark:text-dark-muted"
                                      th:text="${#temporals.format(message.createdAt, 'HH:mm:ss')}">10:25:10</span>
                            </div>
                            <div class="bg-blue-100 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 rounded-lg px-4 py-3">
                                <p class="text-gray-900 dark:text-dark-text whitespace-pre-wrap"
                                   th:text="${message.content}">자기소개를 부탁드립니다.</p>
                            </div>
                        </div>
                    </div>

                    <!-- USER 메시지 (오른쪽, 초록색) -->
                    <div th:if="${message.sender.name() == 'USER'}" class="flex justify-end">
                        <div class="max-w-xl">
                            <div class="flex items-center justify-end gap-2 mb-1">
                                <span class="text-xs text-gray-500 dark:text-dark-muted"
                                      th:text="${#temporals.format(message.createdAt, 'HH:mm:ss')}">10:25:45</span>
                                <div class="w-8 h-8 rounded-full bg-green-500 flex items-center justify-center text-white font-bold text-sm">
                                    나
                                </div>
                            </div>
                            <div class="bg-green-100 dark:bg-green-900/30 border border-green-200 dark:border-green-800 rounded-lg px-4 py-3">
                                <p class="text-gray-900 dark:text-dark-text whitespace-pre-wrap"
                                   th:text="${message.content}">안녕하세요, 저는...</p>
                                <!-- 평가 점수는 최종 결과 페이지에서만 표시 -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 로딩 인디케이터 (JavaScript로 제어) -->
                <div id="loadingIndicator" class="hidden flex justify-start">
                    <div class="max-w-xl">
                        <div class="flex items-center gap-2 mb-1">
                            <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold text-sm">
                                AI
                            </div>
                            <span class="text-xs text-gray-500 dark:text-dark-muted">입력 중...</span>
                        </div>
                        <div class="bg-blue-100 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 rounded-lg px-4 py-3">
                            <div class="flex items-center gap-2">
                                <div class="animate-pulse flex space-x-2">
                                    <div class="w-2 h-2 bg-blue-500 rounded-full"></div>
                                    <div class="w-2 h-2 bg-blue-500 rounded-full animation-delay-200"></div>
                                    <div class="w-2 h-2 bg-blue-500 rounded-full animation-delay-400"></div>
                                </div>
                                <span class="text-sm text-gray-600 dark:text-dark-muted">AI가 답변 생성 중...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 입력 폼 -->
        <div class="card">
            <form id="messageForm" class="space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div>
                    <label for="messageContent" class="block text-sm font-semibold text-gray-700 dark:text-dark-text mb-2">
                        답변 입력 (최대 200자)
                    </label>
                    <textarea id="messageContent"
                              name="content"
                              rows="3"
                              maxlength="200"
                              required
                              placeholder="답변을 입력하세요... (Shift+Enter: 줄바꿈, Enter: 전송)"
                              class="block w-full px-4 py-3 border border-gray-300 dark:border-dark-border rounded-lg
                                     bg-white dark:bg-dark-bg text-gray-900 dark:text-dark-text
                                     placeholder-gray-400 dark:placeholder-gray-500
                                     focus:ring-2 focus:ring-primary focus:border-primary
                                     transition-all duration-200 shadow-sm resize-none"></textarea>
                    <div class="flex justify-between items-center mt-2">
                        <span id="charCount" class="text-xs text-gray-500 dark:text-dark-muted">0 / 200자</span>
                    </div>
                </div>

                <button type="submit"
                        id="sendButton"
                        class="w-full btn-neon">
                    전송
                </button>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:inline="javascript">
    /*<![CDATA[*/
    const interviewId = /*[[${interview.id}]]*/ 0;
    const csrfToken = /*[[${_csrf.token}]]*/ '';
    const csrfHeader = /*[[${_csrf.headerName}]]*/ '';

    // 에러 알림 표시
    function showErrorAlert(title, message, detail = '') {
        const errorAlert = document.getElementById('errorAlert');
        const errorTitle = document.getElementById('errorTitle');
        const errorMessage = document.getElementById('errorMessage');
        const errorDetail = document.getElementById('errorDetail');

        errorTitle.textContent = title;
        errorMessage.textContent = message;
        errorDetail.textContent = detail;

        errorAlert.classList.remove('hidden');

        // 자동으로 스크롤
        errorAlert.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // 에러 알림 닫기
    function closeErrorAlert() {
        document.getElementById('errorAlert').classList.add('hidden');
    }

    // 면접 종료 핸들러 (AJAX)
    async function handleEndInterview() {
        // 확인 다이얼로그
        if (!confirm('면접을 종료하시겠습니까? 종합 평가가 생성됩니다.')) {
            return;
        }

        const endBtn = document.getElementById('endBtn');
        const endText = document.getElementById('endText');
        const endLoadingText = document.getElementById('endLoadingText');

        // 에러 알림 숨김
        closeErrorAlert();

        // 로딩 UI 표시
        endText.classList.add('hidden');
        endLoadingText.classList.remove('hidden');
        endBtn.disabled = true;

        try {
            const response = await fetch(`/mock-interviews/${interviewId}/end`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                }
            });

            const data = await response.json();

            if (data.success) {
                // 성공: 결과 페이지로 이동
                window.location.href = data.redirectUrl;
            } else {
                // 실패: 에러 메시지 표시
                const errorMessages = {
                    'AI_PARSE_ERROR': '종합 평가 생성 중 오류가 발생했습니다',
                    'INVALID_REQUEST': '잘못된 요청입니다',
                    'NOT_FOUND': '면접을 찾을 수 없습니다',
                    'UNKNOWN_ERROR': '서버 오류가 발생했습니다'
                };

                const errorTitle = errorMessages[data.errorType] || '오류 발생';
                showErrorAlert(errorTitle, data.error, data.detail || '');

                // 로딩 UI 복원
                endText.classList.remove('hidden');
                endLoadingText.classList.add('hidden');
                endBtn.disabled = false;
            }
        } catch (error) {
            console.error('면접 종료 요청 실패:', error);

            showErrorAlert(
                '네트워크 오류',
                '서버와의 연결이 끊어졌습니다',
                '인터넷 연결을 확인하고 다시 시도해주세요'
            );

            // 로딩 UI 복원
            endText.classList.remove('hidden');
            endLoadingText.classList.add('hidden');
            endBtn.disabled = false;
        }
    }

    // 면접 종료 버튼 이벤트 리스너
    document.getElementById('endBtn').addEventListener('click', handleEndInterview);

    // DOM 요소
    const messagesContainer = document.getElementById('messagesContainer');
    const messageForm = document.getElementById('messageForm');
    const messageContent = document.getElementById('messageContent');
    const sendButton = document.getElementById('sendButton');
    const charCount = document.getElementById('charCount');
    const loadingIndicator = document.getElementById('loadingIndicator');

    // 중복 메시지 방지용 Set (POST와 SSE 모두에서 USER 메시지가 올 수 있음)
    const displayedMessageIds = new Set();

    // SSE 연결 (Server-Sent Events)
    const eventSource = new EventSource(`/mock-interviews/${interviewId}/stream`);

    // SSE: 메시지 수신
    eventSource.onmessage = (event) => {
        console.log('SSE 메시지 수신:', event.data);

        try {
            const message = JSON.parse(event.data);

            // 중복 체크 후 메시지 추가
            appendMessage(message);

            // 메시지 종류에 따른 로딩 처리
            if (message.sender === 'USER') {
                // 사용자 메시지 추가 후 → AI 응답 대기 로딩 표시 (사용자 답변 아래)
                showLoadingIndicator();
            } else if (message.sender === 'AI') {
                // AI 메시지 추가 전 → 로딩 숨김 (로딩을 AI 메시지가 대체)
                hideLoadingIndicator();
            }
        } catch (error) {
            console.error('SSE 메시지 파싱 실패:', error);
        }
    };

    // SSE: 연결 에러
    eventSource.onerror = (error) => {
        console.error('SSE 연결 에러:', error);

        // 재연결 메시지 표시 (EventSource는 자동 재연결 시도)
        showToast('연결이 끊어졌습니다. 재연결 중...', 'warning');
    };

    // 메시지 전송
    messageForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const content = messageContent.value.trim();
        if (!content) {
            showToast('답변을 입력해주세요', 'error');
            return;
        }

        if (content.length > 200) {
            showToast('답변은 200자 이내로 작성해주세요', 'error');
            return;
        }

        // UI 비활성화
        sendButton.disabled = true;
        messageContent.disabled = true;
        // showLoadingIndicator()는 SSE로 사용자 메시지 수신 후 표시 (자연스러운 흐름)

        try {
            const response = await fetch(`/mock-interviews/${interviewId}/messages`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    [csrfHeader]: csrfToken
                },
                body: new URLSearchParams({ content })
            });

            const result = await response.json();

            if (result.success) {
                // ✅ 서버에서 받은 메시지 데이터로 UI 업데이트
                // (SSE가 더 빠를 수 있으므로 중복 체크로 방어)
                if (result.message) {
                    appendMessage(result.message);
                }

                // 입력 초기화
                messageContent.value = '';
                updateCharCount();

                // 로딩 인디케이터는 AI 응답이 올 때까지 유지 (hideLoadingIndicator 호출 안 함)
            } else {
                hideLoadingIndicator();
                showToast(result.error || '메시지 전송 실패', 'error');
            }
        } catch (error) {
            hideLoadingIndicator();
            console.error('메시지 전송 에러:', error);
            showToast('메시지 전송 중 오류가 발생했습니다', 'error');
        } finally {
            // UI 활성화
            sendButton.disabled = false;
            messageContent.disabled = false;
        }
    });

    // Enter 키 전송 (Shift+Enter는 줄바꿈)
    messageContent.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            messageForm.dispatchEvent(new Event('submit'));
        }
    });

    // 글자 수 카운터
    messageContent.addEventListener('input', updateCharCount);

    function updateCharCount() {
        const count = messageContent.value.length;
        charCount.textContent = `${count} / 200자`;

        if (count > 180) {
            charCount.classList.add('text-red-600', 'dark:text-red-400', 'font-bold');
        } else {
            charCount.classList.remove('text-red-600', 'dark:text-red-400', 'font-bold');
        }
    }

    // 메시지 DOM 추가 (중복 체크 포함)
    function appendMessage(message) {
        // 중복 체크: 같은 ID의 메시지가 이미 표시되었으면 무시
        if (displayedMessageIds.has(message.id)) {
            console.log('중복 메시지 무시 - ID:', message.id, 'sender:', message.sender);
            return;
        }

        const messageDiv = createMessageElement(message);
        messageDiv.dataset.messageId = message.id;  // 메시지 ID 저장
        messageDiv.dataset.createdAt = message.createdAt;  // 생성 시간 저장

        messagesContainer.appendChild(messageDiv);
        scrollToBottom();

        // 표시된 메시지 ID 기록
        displayedMessageIds.add(message.id);
        console.log('메시지 추가 완료 - ID:', message.id, 'sender:', message.sender, 'createdAt:', message.createdAt);
    }

    // 메시지 HTML 생성
    function createMessageElement(message) {
        const div = document.createElement('div');

        if (message.sender === 'AI') {
            // AI 메시지
            div.innerHTML = `
                <div class="flex justify-start">
                    <div class="max-w-xl">
                        <div class="flex items-center gap-2 mb-1">
                            <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold text-sm">
                                AI
                            </div>
                            <span class="text-xs text-gray-500 dark:text-dark-muted">${formatTime(message.createdAt)}</span>
                        </div>
                        <div class="bg-blue-100 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 rounded-lg px-4 py-3">
                            <p class="text-gray-900 dark:text-dark-text whitespace-pre-wrap">${escapeHtml(message.content)}</p>
                        </div>
                    </div>
                </div>
            `;
        } else {
            // USER 메시지 (평가 점수는 최종 결과 페이지에서만 표시)
            div.innerHTML = `
                <div class="flex justify-end">
                    <div class="max-w-xl">
                        <div class="flex items-center justify-end gap-2 mb-1">
                            <span class="text-xs text-gray-500 dark:text-dark-muted">${formatTime(message.createdAt)}</span>
                            <div class="w-8 h-8 rounded-full bg-green-500 flex items-center justify-center text-white font-bold text-sm">
                                나
                            </div>
                        </div>
                        <div class="bg-green-100 dark:bg-green-900/30 border border-green-200 dark:border-green-800 rounded-lg px-4 py-3">
                            <p class="text-gray-900 dark:text-dark-text whitespace-pre-wrap">${escapeHtml(message.content)}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        return div;
    }

    // 자동 스크롤
    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // 로딩 인디케이터 표시
    function showLoadingIndicator() {
        // 핵심: 로딩 인디케이터를 항상 컨테이너의 마지막으로 이동
        // (사용자 답변 바로 아래 위치하도록)
        messagesContainer.appendChild(loadingIndicator);

        // 표시
        loadingIndicator.classList.remove('hidden');
        scrollToBottom();
    }

    // 로딩 인디케이터 숨기기
    function hideLoadingIndicator() {
        loadingIndicator.classList.add('hidden');
    }

    // 시간 포맷 (HH:mm:ss)
    function formatTime(timestamp) {
        if (!timestamp) {
            return '--:--:--';
        }

        try {
            // timestamp가 문자열인 경우 (ISO 8601 형식)
            const date = new Date(timestamp);

            // Invalid Date 체크
            if (isNaN(date.getTime())) {
                console.error('Invalid timestamp:', timestamp);
                return '--:--:--';
            }

            // HH:MM:SS 형식으로 수동 포맷팅
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        } catch (error) {
            console.error('Error formatting time:', error, 'timestamp:', timestamp);
            return '--:--:--';
        }
    }

    // HTML 이스케이프
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Toast 메시지 (layout.html에서 정의된 함수 사용)
    function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        toastMessage.textContent = message;

        // 색상 변경
        toast.className = 'fixed top-4 right-4 z-50 px-6 py-4 rounded-lg shadow-lg transition-all duration-300 transform translate-x-0 opacity-100';
        if (type === 'error') {
            toast.classList.add('bg-red-600', 'text-white');
        } else if (type === 'warning') {
            toast.classList.add('bg-yellow-500', 'text-gray-900');
        } else {
            toast.classList.add('bg-green-600', 'text-white');
        }

        toast.classList.remove('hidden');

        setTimeout(() => {
            toast.classList.add('hidden');
        }, 3000);
    }

    // 페이지 로드 시 스크롤
    window.addEventListener('load', () => {
        scrollToBottom();
    });

    // 페이지 언로드 시 SSE 연결 종료
    window.addEventListener('beforeunload', () => {
        eventSource.close();
    });
    /*]]>*/
</script>

<!-- Dark mode script -->
<script th:replace="~{fragments/layout :: dark-mode-script}"></script>

</body>
</html>
